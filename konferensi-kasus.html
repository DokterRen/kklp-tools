<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Konferensi Kasus Terpadu</title>
<meta name="description" content="Rencana perawatan terpadu pasien rawat inap yang dikoordinasi Kedokteran Keluarga, dengan ringkasan bahasa sederhana untuk keluarga. Siap cetak A4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/instrumen.css">
<style>
.opts.three .opt span, .opts.two .opt span { min-height: 34px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.trow { display: grid; gap: 6px; align-items: center; }
.trow .idx { font-size: 12px; color: var(--muted); text-align: right; }
.t-ps { grid-template-columns: 18px minmax(0, 1.3fr) minmax(0, 1fr); }
.t-ms { grid-template-columns: 18px minmax(0, 1fr) 62px 62px; }
.t-ms2 { grid-template-columns: 18px minmax(0, 1fr); }
.t-kp { grid-template-columns: 18px minmax(0, 1fr) minmax(0, 1.4fr); }
.t-ob { grid-template-columns: 18px 70px minmax(0, 1fr) minmax(0, 1fr); }
.t-tk { grid-template-columns: 18px minmax(0, 1.6fr) minmax(0, 1fr); }
.t-tk2 { grid-template-columns: 18px minmax(0, 1fr) 100px; }
.subrow { display: flex; flex-direction: column; gap: 4px; padding: 6px 0; border-top: 1px dashed var(--line); }
.subrow:first-of-type { border-top: 0; }
.subrow[hidden] { display: none; }
select { padding: 6px 4px; }
.sublbl { font-size: 13px; font-weight: 700; color: var(--deep); margin: 4px 0 -2px; }
@media (max-width: 520px) { .t-ob { grid-template-columns: 18px 64px minmax(0, 1fr); } .t-ob > :last-child { grid-column: 2 / -1; } }

/* ---- printed sheets ---- */
.sheet .pg { width: 794px; height: 1123px; box-sizing: border-box; padding: 36px 42px 32px; display: flex; flex-direction: column; gap: 10px; font-family: 'Source Sans 3', 'Segoe UI', sans-serif; color: #16302E; }
.sheet .ln { display: flex; align-items: flex-end; height: 23px; border-bottom: 1.2px solid #B9CFCC; white-space: nowrap; overflow: hidden; font-size: 13px; padding: 0 2px 3px; box-sizing: border-box; min-width: 0; font-weight: 600; }
.sheet .sec { display: flex; align-items: center; gap: 9px; }
.sheet .num { width: 24px; height: 24px; border-radius: 12px; background: #013A40; color: #FFFFFF; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sheet .st { font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; font-weight: 700; color: #013A40; }
.sheet .hint { font-size: 12px; color: #4A6563; }
.sheet .lbl { font-size: 12.5px; font-weight: 700; color: #013A40; }
.sheet .cb { display: inline-block; width: 13px; height: 13px; border: 1.6px solid #16302E; border-radius: 3px; box-sizing: border-box; flex-shrink: 0; }
.sheet .op { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sheet .ops { display: flex; flex-wrap: wrap; gap: 4px 15px; font-size: 12.5px; align-items: center; }
.sheet .frow .ops { flex-wrap: nowrap; gap: 4px 12px; padding-bottom: 2px; }
.sheet .box { border: 1.5px solid #9FC9C4; border-radius: 8px; padding: 6px 11px 8px; display: flex; flex-direction: column; }
.sheet .tb { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
.sheet .tb th { background: #028090; color: #FFFFFF; text-align: left; padding: 4px 8px; border: 1px solid #028090; font-weight: 700; }
.sheet .tb td { border: 1px solid #B9CFCC; height: 25px; padding: 0 8px; }
.sheet .tb td.n { text-align: center; color: #4A6563; font-weight: 700; }
.sheet .tb td.c { padding: 0; text-align: center; }
.sheet .cell { height: 24px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; font-size: 12.5px; font-weight: 600; }
.sheet .codes { display: inline-flex; gap: 5px; justify-content: center; align-items: center; height: 24px; }
.sheet .codes span { width: 17px; height: 17px; display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; color: #4A6563; border-radius: 9px; box-sizing: border-box; }
.sheet .codes span.sel { border: 1.6px solid #013A40; color: #013A40; }
.sheet .codes.has span:not(.sel) { opacity: .35; }
.sheet .done { font-weight: 700; color: #013A40; font-size: 14px; }
.sheet .idg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 14px; }
.sheet .idg > div { display: flex; flex-direction: column; min-width: 0; }
.sheet .idg > div > span:first-child { font-size: 11.5px; font-weight: 600; color: #4A6563; }
.sheet .idv { height: 18px; border-bottom: 1.2px solid #8FB3AF; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; display: flex; align-items: flex-end; padding: 0 1px 2px; box-sizing: border-box; }
.sheet .frow { display: flex; align-items: flex-end; gap: 8px; font-size: 12.5px; min-width: 0; }
.sheet .frow > b { font-weight: 700; color: #013A40; flex-shrink: 0; padding-bottom: 3px; }
.sheet .fv { flex-grow: 1; min-width: 0; height: 20px; border-bottom: 1.2px solid #B9CFCC; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; display: flex; align-items: flex-end; padding: 0 2px 2px; box-sizing: border-box; }
.sheet .fv.w { flex-grow: 0; }
.sheet .u { display: inline-block; min-width: 110px; border-bottom: 1.2px solid #8FB3AF; font-weight: 600; padding: 0 3px; }
.sheet .sig { display: flex; flex-direction: column; gap: 2px; }
.sheet .sig > span:first-child { height: 30px; border-bottom: 1.2px solid #8FB3AF; display: flex; align-items: flex-end; font-weight: 600; font-size: 12.5px; padding-bottom: 2px; white-space: nowrap; overflow: hidden; }
.sheet .sig > span:last-child { color: #4A6563; font-weight: 600; }
/* family summary */
.sheet .fam { font-size: 14px; gap: 9px; }
.sheet .fam .ln { height: 24px; font-size: 14px; }
.sheet .fam .card { border: 1.5px solid #9FC9C4; border-radius: 10px; padding: 6px 14px 8px; display: flex; flex-direction: column; }
.sheet .fam .hd { display: flex; align-items: center; gap: 9px; margin-bottom: 1px; }
.sheet .fam .num { background: #028090; }
.sheet .fam .hint { font-size: 12.5px; }
.sheet .fam .li { display: flex; align-items: flex-end; gap: 9px; }
.sheet .fam .li .ln { flex-grow: 1; }
.sheet .fam .li .cb { width: 14px; height: 14px; margin-bottom: 5px; }
.sheet .fam .li .n { font-weight: 700; color: #4A6563; width: 14px; padding-bottom: 4px; font-size: 13px; }
.sheet .fam .frow { font-size: 14px; }
.sheet .fam .fv { height: 24px; font-size: 14px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <a class="home" href="./" aria-label="Kembali ke beranda"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></a>
    <div><h1>Konferensi Kasus Terpadu</h1><p>Rencana perawatan terpadu pasien rawat inap · A4, 2 halaman + ringkasan keluarga</p></div>
  </div>
  <div class="actions">
    <button class="btn" id="btn-new" type="button">Formulir baru</button>
    <button class="btn" id="btn-sample" type="button">Contoh</button>
    <button class="btn primary" id="btn-archive" type="button">Simpan ke daftar pasien</button>
  </div>
</header>

<div class="layout">
  <div class="viewtoggle seg" role="group" aria-label="Tampilan">
    <button type="button" data-view="form">Isi data</button><button type="button" data-view="preview">Pratinjau &amp; cetak</button>
  </div>
  <form class="form-col" id="form" autocomplete="off" onsubmit="return false">
    <div class="idhint" id="idhint" hidden></div>
    <details class="card"><summary>Daftar pasien tersimpan <span class="count" id="arsip-count">0</span></summary><div class="card-body">
      <input type="search" id="arsip-cari" placeholder="Cari nama atau No. RM" aria-label="Cari pasien">
      <div class="archive" id="archive"></div>
      <div class="checks"><button class="btn sm" type="button" id="btn-json">Simpan file data (.json)</button><button class="btn sm" type="button" id="btn-open">Buka file data</button></div>
      <p class="note">Daftar ini hanya tersimpan di browser perangkat ini.</p>
    </div></details>
    <div id="sections"></div>
    <datalist id="disiplin"><option value="DPJP utama"><option value="Kedokteran Keluarga"><option value="Penyakit Dalam"><option value="Neurologi"><option value="Kardiologi"><option value="Bedah"><option value="Rehabilitasi Medik"><option value="Psikiatri"><option value="Perawat penanggung jawab"><option value="Apoteker klinis"><option value="Dietisien"><option value="Fisioterapis"><option value="Manajer pelayanan pasien"><option value="Pekerja sosial"><option value="Rohaniwan"><option value="Pasien"><option value="Keluarga"></datalist>
    <input type="file" id="file-in" accept=".json,application/json" class="sr" tabindex="-1" aria-hidden="true">
  </form>

  <section class="preview-col" aria-label="Pratinjau A4">
    <div class="ptools">
      <button class="btn primary" id="btn-print" type="button">Cetak / Simpan PDF</button>
      <button class="btn" id="btn-pdf" type="button">Unduh PDF</button>
      <span class="sp"></span>
      <span class="note">Kolom yang dikosongkan tercetak sebagai garis untuk ditulis tangan.</span>
    </div>
    <div class="pages" id="pages"></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/app.js"></script>
<script>
(function () {
  "use strict";
  const { $, $$, esc, fmtDate, today } = KKLP;
  const DOKTER = "dr. Caren Andika Surbakti, Sp.KKLP";
  const N_PS = 6, N_MS = 6, N_KP = 3, N_OB = 4, N_TK = 6;
  const R = (n) => Array.from({ length: n }, (_, i) => i + 1);

  /* ---------- form ---------- */
  const txt = (k, label, ph, extra) => `<input type="text" data-k="${k}" aria-label="${esc(label)}"${ph ? ` placeholder="${esc(ph)}"` : ""}${extra || ""}>`;
  const fld = (k, label, ph, type) => `<div class="field"><label for="f-${k}">${label}</label><input type="${type || "text"}" id="f-${k}" data-k="${k}"${ph ? ` placeholder="${esc(ph)}"` : ""}></div>`;
  const radios = (k, opts, cls) => `<div class="opts ${cls || ""}" role="radiogroup">${opts.map(([v, t]) => `<label class="opt"><input type="radio" name="${k}" data-k="${k}" value="${v}"><span>${t}</span></label>`).join("")}</div>`;
  const checks = (items) => `<div class="checks">${items.map(([k, t]) => `<label><input type="checkbox" data-k="${k}"> ${t}</label>`).join("")}</div>`;
  const sel = (k, label, opts) => `<select data-k="${k}" aria-label="${esc(label)}"><option value=""></option>${opts.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>`;
  const card = (id, no, title, inner, open) => `<details class="card" id="sec-${id}"${open ? " open" : ""}><summary>${no ? `<span class="secno">${no}</span> ` : ""}${title}</summary><div class="card-body">${inner}</div></details>`;
  const JENIS = [["B", "B · biomedis"], ["F", "F · fungsional"], ["P", "P · psikososial"]];
  const PRIO = [["M", "M · mendesak"], ["A", "A · aktif"], ["K", "K · kronik"]];
  const UBAH = [["S", "S · stop"], ["B", "B · baru"], ["U", "U · ubah"]];

  $("#sections").innerHTML =
    card("id", "", "Identitas dan konferensi", `
      <div class="field"><label for="f-nama">Nama pasien</label><input type="text" id="f-nama" data-k="nama" data-id="1"></div>
      <div class="grid2"><div class="field"><label for="f-rm">No. RM</label><input type="text" id="f-rm" data-k="rm" data-id="1"></div>
      ${fld("usia", "Usia / jenis kelamin", "mis. 68 th / L")}</div>
      <div class="grid2">${fld("ruang", "Ruang / tempat tidur")}${fld("tglMasuk", "Tanggal masuk", "", "date")}</div>
      <div class="grid2">${fld("tglKonf", "Tanggal konferensi", "", "date")}${fld("dpjp", "DPJP utama")}</div>
      ${fld("koordinator", "Koordinator perawatan")}`, true) +
    card("ps", "1", "Peserta konferensi", `
      <div class="rows" data-rows data-min="3"><div class="trow t-ps rowhead"><span></span><span>Nama</span><span>Disiplin / peran</span></div>
      ${R(N_PS).map((i) => `<div class="trow t-ps rowin"><span class="idx">${i}</span>${txt("ps" + i, "Nama peserta " + i)}${txt("pd" + i, "Disiplin peserta " + i, i === 1 ? "pilih atau ketik" : "", ' list="disiplin"')}</div>`).join("")}</div>
      <p class="note">Paraf ditulis tangan di lembar cetak.</p>`, true) +
    card("rk", "2", "Ringkasan kasus", `
      <div class="field"><span class="lbl-ui">Alasan rawat dan diagnosis kerja</span><div class="rows">${txt("diag1", "Diagnosis baris 1")}${txt("diag2", "Diagnosis baris 2")}</div></div>
      <div class="field"><span class="lbl-ui">Perjalanan selama dirawat</span><div class="rows">${txt("jalan1", "Perjalanan baris 1")}${txt("jalan2", "Perjalanan baris 2")}</div></div>
      ${fld("alasanKonf", "Pertanyaan / alasan konferensi ini", "mis. menyepakati tujuan perawatan dan rencana pulang")}`) +
    card("ms", "3", "Daftar masalah terpadu", `
      <p class="note">Satu daftar untuk semua disiplin. Jenis: B biomedis, F fungsional, P psikososial. Prioritas: M mendesak (selesaikan selama rawat), A aktif, K kronik (lanjut di FKTP).</p>
      <div class="rows" data-rows data-min="3">
      ${R(N_MS).map((i) => `<div class="subrow rowin"><div class="trow t-ms"><span class="idx">${i}</span>${txt("m" + i, "Masalah " + i, i === 1 ? "masalah" : "")}${sel("mj" + i, "Jenis masalah " + i, JENIS)}${sel("mp" + i, "Prioritas masalah " + i, PRIO)}</div>
        <div class="trow t-ms2"><span></span>${txt("mpj" + i, "Penanggung jawab masalah " + i, i === 1 ? "penanggung jawab" : "")}</div></div>`).join("")}</div>`) +
    card("tj", "4", "Tujuan perawatan", `
      ${fld("penting", "Yang paling penting bagi pasien (kata-katanya sendiri)", "mis. ingin pulang dan bisa ke kamar mandi sendiri")}
      <div class="field"><span class="lbl-ui">Tingkat perawatan</span>${radios("tingkat", [["penuh", "Penuh (termasuk ICU)"], ["terbatas", "Terbatas"], ["paliatif", "Kenyamanan / paliatif"]], "three")}</div>
      ${fld("terbatasKet", "Bila terbatas: batasannya", "mis. tanpa intubasi")}
      <div class="field"><span class="lbl-ui">Resusitasi jantung paru (RJP)</span>${radios("rjp", [["ya", "Dilakukan"], ["dnr", "Tidak dilakukan (DNR)"], ["belum", "Belum dibahas"]], "three")}</div>
      <div class="field"><span class="lbl-ui">Pengambil keputusan</span>${radios("putus", [["pasien", "Pasien sendiri"], ["wakil", "Wakil"]], "two")}</div>
      <div class="grid2">${fld("wakil", "Nama wakil")}${fld("hubWakil", "Hubungan dengan pasien")}</div>`) +
    card("kp", "5", "Keputusan dan perbedaan yang diselesaikan", `
      <p class="note">Catat juga tindakan yang disepakati <b>tidak</b> dilakukan.</p>
      <div class="rows"><div class="trow t-kp rowhead"><span></span><span>Isu yang dibahas</span><span>Keputusan tim</span></div>
      ${R(N_KP).map((i) => `<div class="trow t-kp"><span class="idx">${i}</span>${txt("is" + i, "Isu " + i)}${txt("kp" + i, "Keputusan " + i)}</div>`).join("")}</div>`) +
    card("ob", "6", "Rencana obat", `
      <div class="field"><span class="lbl-ui">Rekonsiliasi obat</span>${radios("rekon", [["sudah", "Sudah (lembar terlampir)"], ["belum", "Belum"]], "two")}</div>
      <div class="grid2">${fld("obSebelum", "Jumlah obat sebelum masuk", "", "number")}${fld("obPulang", "Jumlah obat saat pulang", "", "number")}</div>
      <div class="rows"><div class="trow t-ob rowhead"><span></span><span>Perubahan</span><span>Obat dan dosis</span><span>Alasan</span></div>
      ${R(N_OB).map((i) => `<div class="trow t-ob"><span class="idx">${i}</span>${sel("oc" + i, "Jenis perubahan obat " + i, UBAH)}${txt("on" + i, "Obat " + i)}${txt("oa" + i, "Alasan perubahan obat " + i)}</div>`).join("")}</div>
      <p class="note">Daftar obat lengkap: <a href="rekonsiliasi-obat.html">Rekonsiliasi Obat</a>.</p>`) +
    card("kl", "7", "Keluarga dan psikososial", `
      <div class="grid2">${fld("pkKel", "Pengambil keputusan di keluarga")}${fld("pelaku", "Pelaku rawat utama di rumah")}</div>
      <div class="field"><span class="lbl-ui">Pemahaman keluarga tentang kondisi</span>${radios("paham", [["baik", "Baik"], ["sebagian", "Sebagian"], ["kurang", "Kurang / berbeda dengan tim"]], "three")}</div>
      <div class="field"><span class="lbl-ui">Pembiayaan</span>${checks([["by_bpjs", "BPJS Kesehatan"], ["by_asuransi", "Asuransi lain"], ["by_mandiri", "Mandiri"], ["by_kendala", "Ada kendala biaya"]])}</div>
      <div class="field"><span class="lbl-ui">Kesiapan merawat di rumah</span>${radios("siap", [["siap", "Siap"], ["latih", "Perlu pelatihan"], ["belum", "Belum siap / perlu rujuk sosial"]], "three")}</div>
      <p class="note">Bisa dinilai dengan <a href="kesiapan-merawat.html">Kesiapan Merawat</a>.</p>
      ${fld("sosial", "Kebutuhan sosial / spiritual")}
      <div class="grid2">${fld("sampaiOleh", "Hasil disampaikan ke keluarga oleh")}${fld("sampaiTgl", "Tanggal", "", "date")}</div>`) +
    card("pl", "8", "Rencana pulang", `
      <div class="field"><span class="lbl-ui">Kriteria pulang</span><div class="rows">${txt("kriteria1", "Kriteria pulang baris 1", "mis. bebas demam 48 jam, bisa minum obat oral")}${txt("kriteria2", "Kriteria pulang baris 2")}</div></div>
      ${fld("tglPulang", "Perkiraan tanggal pulang", "", "date")}
      <div class="field"><span class="lbl-ui">Pulang ke</span>${radios("pulangKe", [["rumah", "Rumah sendiri"], ["keluarga", "Rumah keluarga"], ["fasilitas", "Fasilitas lain"]], "three")}</div>
      <div class="field"><span class="lbl-ui">Kebutuhan di rumah</span>${checks([["n_edu", "Edukasi pelaku rawat"], ["n_alat", "Alat bantu jalan / kursi roda"], ["n_o2", "Oksigen"], ["n_luka", "Perawatan luka / NGT / kateter"], ["n_kunj", "Kunjungan rumah"], ["n_fisio", "Fisioterapi lanjutan"], ["n_diet", "Diet khusus"]])}</div>
      ${fld("nLain", "Kebutuhan lain")}
      <div class="grid2">${fld("poli", "Kontrol poli")}${fld("rujukBalik", "Rujuk balik ke FKTP")}</div>
      ${fld("kontakTgl", "Kontak pertama setelah pulang (≤ 7 hari)", "", "date")}
      <div class="field"><span class="lbl-ui">Melalui</span>${radios("kontakVia", [["telp", "Telepon"], ["kunjungan", "Kunjungan"], ["kontrol", "Kontrol"]], "three")}</div>`) +
    card("tk", "9", "Daftar tindakan dan evaluasi", `
      <div class="rows" data-rows data-min="3">
      ${R(N_TK).map((i) => `<div class="subrow rowin"><div class="trow t-tk"><span class="idx">${i}</span>${txt("t" + i, "Tindakan " + i, i === 1 ? "tindakan" : "")}${txt("tp" + i, "Penanggung jawab tindakan " + i, i === 1 ? "penanggung jawab" : "")}</div>
        <div class="trow t-tk2"><span></span>${txt("tb" + i, "Batas waktu tindakan " + i, i === 1 ? "batas waktu, mis. Kamis 12/11" : "")}${sel("tc" + i, "Status tindakan " + i, [["ok", "✓ Selesai"]])}</div></div>`).join("")}</div>
      <div class="grid2">${fld("evalTgl", "Evaluasi ulang tanggal", "", "date")}${fld("evalBila", "Evaluasi lebih awal bila", "mis. sepsis berulang, keluarga menolak rencana")}</div>`) +
    card("kf", "", "Ringkasan untuk keluarga", `
      <div class="checks"><label><input type="checkbox" data-k="cetakKel"> Cetak ringkasan untuk keluarga (halaman 3)</label></div>
      <p class="note">Tulis dengan bahasa sehari-hari. Nama, ruang, tanggal, hal yang penting bagi pasien, tanggal pulang, poli, dan koordinator diambil dari isian di atas.</p>
      <div class="field"><span class="lbl-ui">Kondisi saat ini</span><div class="rows">${txt("kf_k1", "Kondisi baris 1", "mis. infeksi paru sudah membaik, tetapi masih lemah")}${txt("kf_k2", "Kondisi baris 2")}${txt("kf_k3", "Kondisi baris 3")}</div></div>
      <div class="field"><span class="lbl-ui">Rencana tim selama di rumah sakit</span><div class="rows">${txt("kf_r1", "Rencana 1")}${txt("kf_r2", "Rencana 2")}${txt("kf_r3", "Rencana 3")}</div></div>
      <div class="field"><span class="lbl-ui">Yang perlu disiapkan keluarga</span><div class="rows">${txt("kf_s1", "Persiapan 1")}${txt("kf_s2", "Persiapan 2")}${txt("kf_s3", "Persiapan 3")}</div></div>

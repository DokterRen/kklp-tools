<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Indeks Glikemik Makanan</title>
<meta name="description" content="Leaflet edukasi pasien diabetes: indeks glikemik makanan sehari-hari dan tips memilih makanan. Siap cetak A4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
/* ---- leaflet sheet ---- */
.sheet .pg { width: 794px; height: 1123px; box-sizing: border-box; padding: 30px 38px 22px; display: flex; flex-direction: column; gap: 11px; font-family: 'Source Sans 3', 'Segoe UI', sans-serif; color: #16302E; }
.sheet .rh { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; border-bottom: 3px solid #013A40; padding-bottom: 8px; }
.sheet .eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; color: #028090; }
.sheet h1 { margin: 2px 0 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 30px; line-height: 1.05; color: #013A40; }
.sheet .sub { font-size: 14px; color: #4A6563; margin-top: 3px; }
.sheet .for { display: grid; grid-template-columns: 54px 170px; gap: 3px 8px; font-size: 13px; align-items: end; }
.sheet .for span { color: #4A6563; font-weight: 600; }
.sheet .for b { border-bottom: 1.2px solid #8FB3AF; min-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
.sheet h2 { margin: 0 0 6px; display: flex; align-items: center; gap: 9px; font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; color: #013A40; }
.sheet h2 .num { width: 24px; height: 24px; border-radius: 12px; background: #013A40; color: #FFFFFF; font-family: 'Source Sans 3', sans-serif; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.sheet .what { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; align-items: start; }
.sheet .what p { margin: 0; font-size: 14px; line-height: 1.45; }
.sheet .levels { display: flex; flex-direction: column; gap: 4px; }
.sheet .lv { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; border-radius: 7px; overflow: hidden; font-size: 13px; }
.sheet .lv b { color: #FFFFFF; text-align: center; padding: 5px 4px; font-size: 13px; line-height: 1.1; }
.sheet .lv b small { display: block; font-size: 11.5px; font-weight: 600; }
.sheet .lv span { padding: 3px 9px; line-height: 1.2; font-size: 12.5px; }
.sheet .lv.lo { background: #E8F4E4; } .sheet .lv.lo b { background: #3E8E3A; }
.sheet .lv.md { background: #FBF1D9; } .sheet .lv.md b { background: #B98200; }
.sheet .lv.hi { background: #F8E3E2; } .sheet .lv.hi b { background: #B3363F; }
.sheet table.gi { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 12px; }
.sheet table.gi th { color: #FFFFFF; font-size: 13px; padding: 5px 8px; text-align: left; }
.sheet table.gi th:first-child { background: #013A40; border-top-left-radius: 7px; }
.sheet table.gi th:last-child { border-top-right-radius: 7px; }
.sheet table.gi th.lo { background: #3E8E3A; } .sheet table.gi th.md { background: #B98200; } .sheet table.gi th.hi { background: #B3363F; }
.sheet table.gi td { padding: 3px 8px; vertical-align: top; border-bottom: 1px solid #D5E4E1; line-height: 1.3; }
.sheet table.gi td:first-child { font-weight: 700; color: #013A40; background: #F4FAF9; }
.sheet table.gi td.lo { background: #F5FAF3; } .sheet table.gi td.md { background: #FEFAF0; } .sheet table.gi td.hi { background: #FDF5F4; }
.sheet .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 12px; }
.sheet .f { display: flex; justify-content: space-between; gap: 6px; }
.sheet .f i { font-style: normal; font-weight: 700; color: #4A6563; }
.sheet .f.star span::after { content: " *"; color: #B3363F; font-weight: 700; }
.sheet .tnote { font-size: 11.5px; color: #4A6563; margin-top: 4px; line-height: 1.35; }
.sheet .tips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; }
.sheet .tip { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 7px; align-items: start; font-size: 12.5px; line-height: 1.32; }
.sheet .tip .ic { width: 28px; height: 28px; border-radius: 8px; background: #EAF5F4; color: #028090; display: flex; align-items: center; justify-content: center; }
.sheet .tip b { display: block; color: #013A40; font-size: 13.5px; }
.sheet .bottom { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 14px; flex-grow: 1; min-height: 0; }
.sheet .plate { background: #F4FAF9; border-radius: 8px; padding: 8px 12px; display: flex; gap: 12px; align-items: center; font-size: 13px; line-height: 1.35; }
.sheet .note { border: 1.5px dashed #013A40; border-radius: 8px; padding: 7px 11px; display: flex; flex-direction: column; min-height: 0; }
.sheet .note .nt { font-weight: 700; color: #013A40; font-size: 13.5px; }
.sheet .note .tx { white-space: pre-wrap; font-size: 13px; line-height: 1.38; flex-grow: 1; overflow: hidden; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 21px, #C8DCD9 21px, #C8DCD9 22px); background-position: 0 -4px; line-height: 22px; }
.sheet .foot { display: flex; justify-content: space-between; gap: 16px; font-size: 10.5px; color: #4A6563; border-top: 1px solid #CFE5E2; padding-top: 5px; line-height: 1.35; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <a class="home" href="./" aria-label="Kembali ke daftar materi edukasi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div><h1>Indeks Glikemik Makanan</h1><p>Leaflet edukasi diabetes · A4, 1 halaman</p></div>
  </div>
  <div class="actions">
    <button class="btn" id="btn-new" type="button">Kosongkan</button>
    <button class="btn primary" id="btn-print2" type="button">Cetak</button>
  </div>
</header>

<div class="layout">
  <div class="viewtoggle seg" role="group" aria-label="Tampilan">
    <button type="button" data-view="form">Isi (opsional)</button><button type="button" data-view="preview">Pratinjau &amp; cetak</button>
  </div>
  <form class="form-col" id="form" autocomplete="off" onsubmit="return false">
    <details class="card" open><summary>Untuk pasien (opsional)</summary><div class="card-body">
      <p class="note">Boleh dikosongkan; kolom nama dan catatan akan tercetak sebagai garis kosong untuk ditulis tangan.</p>
      <div class="field"><label for="f-nama">Nama pasien</label><input type="text" id="f-nama" data-k="nama"></div>
      <div class="field"><label for="f-tgl">Tanggal</label><input type="date" id="f-tgl" data-k="tanggal"></div>
      <div class="field"><label for="f-cat">Catatan dokter untuk pasien ini</label><textarea id="f-cat" data-k="catatan" rows="5" placeholder="mis. Target gula darah puasa 80–130. Ganti nasi putih malam hari dengan setengah porsi nasi merah dan perbanyak sayur."></textarea></div>
      <div class="field"><label for="f-foot">Kaki halaman</label><input type="text" id="f-foot" data-k="footer"></div>
    </div></details>
  </form>
  <section class="preview-col" aria-label="Pratinjau A4">
    <div class="ptools">
      <button class="btn primary" id="btn-print" type="button">Cetak / Simpan PDF</button>
      <button class="btn" id="btn-pdf" type="button">Unduh PDF</button>
    </div>
    <div class="pages" id="pages"><div class="pagebox"><div class="sheet" id="sheet1"></div></div></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../assets/app.js"></script>
<script>
(function () {
  "use strict";
  const { $, esc, fmtDate, today } = KKLP;
  const DOKTER = "dr. Caren Andika Surbakti, Sp.KKLP";
  /* GI values: Atkinson, Foster-Powell & Brand-Miller, Diabetes Care 2008;31:2281–3, Table 1 (glucose = 100).
     [name, GI, star] — star = low GI only because of fat/sugar content */
  const ROWS = [
    ["Makanan pokok",
      [["Spageti / pasta", 49], ["Jagung manis", 52], ["Bihun / mi beras", 53], ["Oat gulung", 55]],
      [["Nasi merah", 68]],
      [["Nasi putih", 73], ["Roti gandum", 74], ["Roti tawar", 75], ["Bubur nasi", 78], ["Oat instan", 79], ["Cornflakes", 81]]],
    ["Umbi dan sayur",
      [["Wortel rebus", 39], ["Sup sayur", 48], ["Talas rebus", 53], ["Pisang kepok rebus", 55]],
      [["Ubi jalar rebus", 63], ["Kentang goreng", 63, 1], ["Labu kuning rebus", 64]],
      [["Kentang rebus", 78], ["Kentang tumbuk", 87]]],
    ["Buah",
      [["Apel", 36], ["Jus apel", 41], ["Kurma", 42], ["Jeruk", 43], ["Jus jeruk", 50], ["Pisang", 51], ["Mangga", 51]],
      [["Nanas", 59]],
      [["Semangka", 76]]],
    ["Kacang dan susu",
      [["Kedelai", 16], ["Kacang merah", 24], ["Kacang arab", 28], ["Susu kedelai", 34], ["Susu skim", 37], ["Susu sapi", 39], ["Yoghurt buah", 41], ["Es krim", 51, 1]],
      [],
      []],
    ["Camilan, gula, dan minuman",
      [["Cokelat", 40, 1]],
      [["Keripik kentang", 56, 1], ["Minuman bersoda", 59], ["Madu", 61], ["Gula pasir", 65]],
      [["Kerupuk beras", 87]]],
  ];
  const cell = (list, cls) => `<td class="${cls}">${list.length ? `<div class="${cls === "md" ? "" : "cols"}">` + list.map(([n, v, s]) => `<div class="f${s ? " star" : ""}"><span>${n}</span><i>${v}</i></div>`).join("") + `</div>` : `<span style="color:#9AB0AD">–</span>`}</td>`;
  const I = {
    plate: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M12 12h9"/></svg>',
    mix: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>',
    whole: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7c-4-3-8 0-7 5s4 9 7 8c3 1 6-3 7-8s-3-8-7-5z"/><path d="M12 7c0-2 1-3 3-4"/></svg>',
    cook: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 11h20M9 7V5M15 7V5"/></svg>',
    portion: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v7a3 3 0 0 0 6 0V3M9 13v8M17 3c-2 2-2 6 0 8v10"/></svg>',
    drink: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l-2 18H8z"/><path d="M4 21L20 3"/></svg>',
  };
  const tip = (ic, t, d) => `<div class="tip"><div class="ic">${I[ic]}</div><div><b>${t}</b>${d}</div></div>`;
  function render(st) {
    $("#sheet1").innerHTML = `<div class="pg">
      <div class="rh"><div><div class="eyebrow">KEDOKTERAN KELUARGA LAYANAN PRIMER · EDUKASI DIABETES</div><h1>Indeks Glikemik Makanan</h1><div class="sub">Memilih makanan agar gula darah tidak cepat melonjak</div></div>
        <div class="for"><span>Untuk</span><b>${esc(st.nama || "")}</b><span>Tanggal</span><b>${esc(fmtDate(st.tanggal, "short"))}</b></div></div>
      <section class="what">
        <div><h2><span class="num">1</span>Apa itu indeks glikemik?</h2>
          <p><b>Indeks glikemik (IG)</b> menunjukkan seberapa cepat makanan berkarbohidrat menaikkan gula darah, dibandingkan dengan gula murni (glukosa = 100). Makanan ber-IG rendah dicerna lebih lambat, sehingga gula darah naik perlahan dan rasa kenyang bertahan lebih lama.</p></div>
        <div class="levels">
          <div class="lv lo"><b>Rendah<small>55 ke bawah</small></b><span><b style="color:#2F6F2C;padding:0;background:none;display:inline">Pilih lebih sering</b>, tetap sesuai porsi</span></div>
          <div class="lv md"><b>Sedang<small>56–69</small></b><span><b style="color:#8A6100;padding:0;background:none;display:inline">Batasi porsi</b>, padukan dengan sayur dan lauk</span></div>
          <div class="lv hi"><b>Tinggi<small>70 ke atas</small></b><span><b style="color:#922B33;padding:0;background:none;display:inline">Jarang dan porsi kecil</b>, jangan dimakan sendirian</span></div>
        </div>
      </section>
      <section><h2><span class="num">2</span>Nilai IG makanan sehari-hari</h2>
        <table class="gi"><colgroup><col style="width:12%"><col><col style="width:19%"><col style="width:31%"></colgroup>
          <thead><tr><th>Kelompok</th><th class="lo">IG rendah (≤ 55)</th><th class="md">IG sedang (56–69)</th><th class="hi">IG tinggi (≥ 70)</th></tr></thead>
          <tbody>${ROWS.map(([g, lo, md, hi]) => `<tr><td>${g}</td>${cell(lo, "lo")}${cell(md, "md")}${cell(hi, "hi")}</tr>`).join("")}<tr><td>Lauk</td><td colspan="3" style="background:#F4FAF9"><b>Ikan, ayam, telur, tahu, tempe</b> hampir tanpa karbohidrat, sehingga tidak punya nilai IG. Pilih yang dikukus, direbus, atau dipanggang.</td></tr></tbody></table>
        <div class="tnote"><b style="color:#B3363F">*</b> IG-nya rendah atau sedang karena banyak mengandung lemak atau gula, bukan karena sehat. Tetap dibatasi. · Nilai dapat berbeda menurut varietas, kematangan, dan cara memasak.</div>
      </section>
      <section><h2><span class="num">3</span>Cara menjaga gula darah tetap stabil</h2>
        <div class="tips">
          ${tip("plate", "Atur isi piring", "Separuh piring sayur, seperempat lauk (ikan, tempe), seperempat nasi, sekitar 1 centong.")}
          ${tip("mix", "Jangan makan karbohidrat sendirian", "Makan nasi atau roti bersama sayur dan lauk; seratnya memperlambat naiknya gula darah.")}
          ${tip("whole", "Pilih bentuk utuh", "Buah utuh lebih baik daripada jus. Oat gulung lebih baik daripada oat instan.")}
          ${tip("cook", "Perhatikan cara memasak", "Makin lembek dan lama dimasak (bubur, kentang tumbuk), makin cepat gula darah naik.")}
          ${tip("portion", "Porsi tetap penting", "IG rendah bukan berarti boleh banyak. Dua piring nasi merah tetap menaikkan gula darah.")}
          ${tip("drink", "Hindari minuman manis", "Ganti teh manis, sirup, dan minuman bersoda dengan air putih atau teh tanpa gula.")}
        </div>
      </section>
      <div class="bottom">
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="plate" style="background:#FCF1E4;color:#6B3F0C;flex-grow:1;align-items:flex-start"><div><b>Kenali tubuh Anda.</b> Reaksi tiap orang bisa berbeda. Periksa gula darah 2 jam sesudah makan untuk melihat makanan mana yang paling menaikkan gula darah Anda.</div></div>
        </div>
        <div class="note"><div class="nt">Catatan dokter</div><div class="tx">${esc(st.catatan || "")}</div></div>
      </div>
      <div class="foot"><span>${esc(st.footer || "")}<br>Sumber nilai IG: Atkinson FS, Foster-Powell K, Brand-Miller JC. International tables of glycemic index and glycemic load values: 2008. Diabetes Care 2008;31:2281–3 (nilai rerata, glukosa = 100).</span><span style="white-space:nowrap;align-self:flex-end">Leaflet ini tidak menggantikan<br>nasihat dokter atau ahli gizi.</span></div>
    </div>`;
  }
  function defaults() { return { tanggal: "", footer: "Edukasi Pasien - " + DOKTER }; }
  KKLP.docTool({ key: "edukasi-ig", defaults, sample: () => ({}), render });
  $("#btn-print2").addEventListener("click", () => $("#btn-print").click());
  void today;
})();
</script>
</body>
</html>

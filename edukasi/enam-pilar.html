<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>6 Pilar Gaya Hidup Sehat</title>
<meta name="description" content="Leaflet edukasi enam pilar lifestyle medicine: nutrisi, aktivitas fisik, tidur, stres, hubungan sosial, dan menghindari zat berisiko. Siap cetak A4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="leaflet.css">
<style>
.sheet .intro { font-size: 13.5px; line-height: 1.42; margin: 0; }
.sheet .pillars { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 12px; }
.sheet .pl { border: 1.5px solid var(--c); border-radius: 9px; overflow: hidden; display: flex; flex-direction: column; background: #FFFFFF; }
.sheet .pl .ph { display: flex; align-items: center; gap: 9px; padding: 6px 10px; background: var(--bg); }
.sheet .pl .ph .ico { background: var(--c); color: #FFFFFF; }
.sheet .pl .ph b { font-family: 'Source Serif 4', Georgia, serif; font-size: 16.5px; color: var(--d); line-height: 1.1; }
.sheet .pl .ph small { display: block; font-family: 'Source Sans 3', sans-serif; font-size: 11.5px; font-weight: 600; color: #4A6563; margin-top: 1px; }
.sheet .pl .ph .pick { margin-left: auto; font-size: 11px; font-weight: 700; color: #FFFFFF; background: var(--c); border-radius: 10px; padding: 2px 8px; white-space: nowrap; }
.sheet .pl ul.b { padding: 6px 10px 2px 26px; font-size: 12.5px; line-height: 1.33; flex-grow: 1; }
.sheet .pl .start { margin: 0 10px 7px; padding: 4px 8px; border-radius: 6px; background: var(--bg); font-size: 12px; line-height: 1.3; color: #16302E; }
.sheet .pl .start b { color: var(--d); }
.sheet .pl.dim { opacity: .55; }
.sheet .pl.on { box-shadow: 0 0 0 2.5px var(--c); }
.sheet .bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; flex-grow: 1; min-height: 0; }
.sheet .goals { border: 1.5px solid #028090; border-radius: 8px; padding: 7px 11px; display: flex; flex-direction: column; min-height: 0; }
.sheet .goals .nt { font-weight: 700; color: #013A40; font-size: 13.5px; }
.sheet .goals .hint { font-size: 11.5px; color: #4A6563; margin-bottom: 2px; }
.sheet .goal { display: grid; grid-template-columns: 18px minmax(0, 1fr); align-items: end; gap: 4px; border-bottom: 1.2px solid #C8DCD9; min-height: 25px; font-size: 13px; padding-bottom: 2px; }
.sheet .goal i { font-style: normal; font-weight: 700; color: #028090; }
.sheet .goal span { overflow: hidden; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <a class="home" href="./" aria-label="Kembali ke daftar materi edukasi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div><h1>6 Pilar Gaya Hidup Sehat</h1><p>Leaflet lifestyle medicine · A4, 1 halaman</p></div>
  </div>
  <div class="actions">
    <button class="btn" id="btn-new" type="button">Kosongkan</button>
    <button class="btn primary" id="btn-print2" type="button">Cetak</button>
  </div>
</header>

<div class="layout">
  <div class="viewtoggle seg" role="group" aria-label="Tampilan">
    <button type="button" data-view="form">Isi (opsional)</button><button type="button" data-view="preview">Pratinjau &amp; cetak</button>
  </div>
  <form class="form-col" id="form" autocomplete="off" onsubmit="return false">
    <details class="card" open><summary>Untuk pasien (opsional)</summary><div class="card-body">
      <p class="note">Semua boleh dikosongkan; kolom akan tercetak sebagai garis kosong untuk ditulis tangan.</p>
      <div class="field"><label for="f-nama">Nama pasien</label><input type="text" id="f-nama" data-k="nama"></div>
      <div class="field"><label for="f-tgl">Tanggal</label><input type="date" id="f-tgl" data-k="tanggal"></div>
      <div class="field"><span class="lbl-ui">Pilar yang menjadi fokus (ditandai pada leaflet)</span>
        <div class="checks" id="pick"></div>
        <label class="checks" style="margin-top:4px"><input type="checkbox" data-k="dimOthers"> Samarkan pilar yang tidak dipilih</label>
      </div>
      <div class="field"><span class="lbl-ui">Langkah kecil yang disepakati</span>
        <div class="rows">
          <input type="text" data-k="g1" aria-label="Langkah 1" placeholder="mis. Jalan kaki 20 menit setiap pagi, 5 hari seminggu">
          <input type="text" data-k="g2" aria-label="Langkah 2" placeholder="mis. Ganti teh manis dengan teh tanpa gula">
          <input type="text" data-k="g3" aria-label="Langkah 3" placeholder="mis. Tidur paling lambat pukul 22.00">
        </div>
      </div>
      <div class="field"><label for="f-cat">Catatan dokter</label><textarea id="f-cat" data-k="catatan" rows="3"></textarea></div>
      <div class="field"><label for="f-foot">Kaki halaman</label><input type="text" id="f-foot" data-k="footer"></div>
    </div></details>
  </form>
  <section class="preview-col" aria-label="Pratinjau A4">
    <div class="ptools">
      <button class="btn primary" id="btn-print" type="button">Cetak / Simpan PDF</button>
      <button class="btn" id="btn-pdf" type="button">Unduh PDF</button>
    </div>
    <div class="pages" id="pages"><div class="pagebox"><div class="sheet" id="sheet1"></div></div></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../assets/app.js"></script>
<script>
(function () {
  "use strict";
  const { $, esc, fmtDate } = KKLP;
  const DOKTER = "dr. Caren Andika Surbakti, Sp.KKLP";
  const svg = (d) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  /* [key, title, subtitle, colour, dark text, tint, icon, bullets, first step] — colours match the LMWPHI result chart */
  const P = [
    ["nut", "Makan sehat", "Nutrisi", "#6FA32E", "#3F6B14", "#F1F7E8", svg('<path d="M12 7c-4-3-8 0-7 5s4 9 7 8c3 1 6-3 7-8s-3-8-7-5z"/><path d="M12 7c0-2 1-3 3-4"/>'),
      ["Utamakan makanan nabati utuh: sayur, buah, kacang-kacangan, tempe, tahu, dan biji-bijian utuh.",
       "Isi piring: separuh sayur dan buah, seperempat makanan pokok, seperempat lauk.",
       "Batasi per hari: gula 4 sendok makan, garam 1 sendok teh, minyak 5 sendok makan.",
       "Kurangi makanan olahan, gorengan, dan minuman manis. Minum air putih sekitar 8 gelas."],
      "tambah satu porsi sayur di setiap makan."],
    ["akt", "Aktif bergerak", "Aktivitas fisik", "#0090C4", "#00648A", "#E6F5FB", svg('<circle cx="13" cy="4" r="2"/><path d="M12 7l-2 6h4l1 5"/><path d="M10 13l-3 7"/><path d="M15 10l3 2"/><path d="M8 10l2-3"/>'),
      ["Minimal 150 menit seminggu aktivitas sedang, mis. jalan cepat 30 menit, 5 hari seminggu.",
       "Latihan penguatan otot (angkat beban ringan, push-up dinding) minimal 2 hari seminggu.",
       "Kurangi duduk lama: berdiri dan bergerak setiap 30–60 menit.",
       "Lansia: tambahkan latihan keseimbangan untuk mencegah jatuh."],
      "jalan kaki 10 menit setelah makan."],
    ["tid", "Tidur cukup", "Tidur yang memulihkan", "#B39600", "#7A6600", "#FBF7E1", svg('<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'),
      ["Dewasa 7–9 jam per malam; lansia 7–8 jam.",
       "Tidur dan bangun pada jam yang sama setiap hari, termasuk hari libur.",
       "Hindari kopi atau teh kental sore hari dan layar ponsel 1 jam sebelum tidur. Kamar gelap, sejuk, tenang.",
       "Mendengkur keras atau henti napas saat tidur? Periksakan ke dokter."],
      "tetapkan jam tidur dan pasang pengingat."],
    ["str", "Kelola stres", "Manajemen stres", "#D98E00", "#8F5D00", "#FDF4E3", svg('<path d="M4 12c2-3 4-3 6 0s4 3 6 0 4-3 4-3"/><path d="M4 17c2-3 4-3 6 0s4 3 6 0 4-3 4-3"/><path d="M4 7c2-3 4-3 6 0s4 3 6 0 4-3 4-3"/>'),
      ["Tarik napas dalam perlahan selama beberapa menit setiap hari.",
       "Luangkan waktu untuk ibadah, hobi, dan berada di alam.",
       "Ceritakan masalah kepada orang yang dipercaya dan jangan ragu meminta bantuan.",
       "Sedih, cemas, atau sulit tidur lebih dari 2 minggu? Bicarakan dengan dokter."],
      "5 menit napas dalam sebelum tidur."],
    ["sos", "Jalin hubungan", "Hubungan sosial positif", "#C0272D", "#8E1C21", "#FBEAEA", svg('<circle cx="8" cy="8" r="3"/><circle cx="17" cy="9.5" r="2.5"/><path d="M2.5 20c0-3.3 2.5-6 5.5-6s5.5 2.7 5.5 6"/><path d="M14 15.6c.9-.4 1.9-.6 3-.6 2.6 0 4.5 2.2 4.5 5"/>'),
      ["Jaga hubungan dengan keluarga, teman, dan tetangga.",
       "Ikut kegiatan komunitas, arisan, atau kegiatan keagamaan.",
       "Makan bersama keluarga dan saling membantu.",
       "Kesepian dan terisolasi meningkatkan risiko penyakit jantung dan stroke."],
      "hubungi satu kerabat atau teman setiap hari."],
    ["zat", "Hindari zat berisiko", "Rokok, alkohol, dan NAPZA", "#7030A0", "#4F1F72", "#F3ECF8", svg('<rect x="2" y="13" width="15" height="4" rx="1"/><path d="M19 13v4M22 13v4M3 3l18 18"/>'),
      ["Berhenti merokok, termasuk rokok elektrik dan vape. Jauhi asap rokok orang lain.",
       "Hindari minuman beralkohol.",
       "Jangan memakai obat tanpa resep atau NAPZA.",
       "Butuh bantuan berhenti merokok? Layanan Berhenti Merokok Kemenkes 0-800-177-6565 (bebas pulsa)."],
      "tentukan tanggal berhenti merokok."],
  ];
  $("#pick").innerHTML = P.map(([k, t]) => `<label><input type="checkbox" data-k="p_${k}"> ${t}</label>`).join("");
  function render(st) {
    const any = P.some(([k]) => st["p_" + k]);
    const card = ([k, t, sub, c, d, bg, ic, bl, start]) => {
      const on = !!st["p_" + k], cls = on ? " on" : (any && st.dimOthers ? " dim" : "");
      return `<div class="pl${cls}" style="--c:${c};--d:${d};--bg:${bg}"><div class="ph"><div class="ico">${ic}</div><div><b>${t}</b><small>${sub}</small></div>${on ? `<span class="pick">Fokus saya</span>` : ""}</div>
        <ul class="b">${bl.map((x) => `<li>${esc(x)}</li>`).join("")}</ul><div class="start"><b>Mulai dari:</b> ${esc(start)}</div></div>`;
    };
    const goal = (i) => `<div class="goal"><i>${i}.</i><span>${esc(st["g" + i] || "")}</span></div>`;
    $("#sheet1").innerHTML = `<div class="pg">
      <div class="rh"><div><div class="eyebrow">KEDOKTERAN KELUARGA LAYANAN PRIMER · LIFESTYLE MEDICINE</div><h1>6 Pilar Gaya Hidup Sehat</h1><div class="sub">Kebiasaan sehari-hari yang mencegah dan membantu mengendalikan penyakit kronis</div></div>
        <div class="for"><span>Untuk</span><b>${esc(st.nama || "")}</b><span>Tanggal</span><b>${esc(fmtDate(st.tanggal, "short"))}</b></div></div>
      <p class="intro">Banyak penyakit kronis seperti diabetes, hipertensi, penyakit jantung, dan stroke dapat dicegah, bahkan diperbaiki, dengan kebiasaan sehari-hari. <b>Anda tidak harus mengubah semuanya sekaligus.</b> Pilih satu atau dua pilar, mulai dari langkah kecil, lalu tambah sedikit demi sedikit.</p>
      <div class="pillars">${P.map(card).join("")}</div>
      <div class="bottom">
        <div class="goals"><div class="nt">Langkah kecil saya</div><div class="hint">Spesifik, terukur, dan bisa dilakukan mulai minggu ini</div>${[1, 2, 3].map(goal).join("")}</div>
        <div class="note"><div class="nt">Catatan dokter</div><div class="tx">${esc(st.catatan || "")}</div></div>
      </div>
      <div class="foot"><span>${esc(st.footer || "")}<br>Enam pilar: American College of Lifestyle Medicine. Aktivitas fisik: WHO 2020. Batas gula, garam, lemak: Permenkes No. 30 Tahun 2013.</span><span style="white-space:nowrap;align-self:flex-end">Leaflet ini tidak menggantikan<br>nasihat dokter.</span></div>
    </div>`;
  }
  function defaults() { return { tanggal: "", footer: "Edukasi Pasien - " + DOKTER }; }
  KKLP.docTool({ key: "edukasi-6pilar", defaults, sample: () => ({}), render });
  $("#btn-print2").addEventListener("click", () => $("#btn-print").click());
})();
</script>
</body>
</html>

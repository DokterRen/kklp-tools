<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perawatan Stroke di Rumah</title>
<meta name="description" content="Leaflet edukasi perawatan pasien stroke di rumah untuk pasien dan keluarga: tanda bahaya, obat, makan aman, posisi, latihan, rumah aman, dan dukungan pelaku rawat. A4 bolak-balik.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<link rel="stylesheet" href="leaflet.css">
<style>
.sheet .alarm { border: 2px solid #A1232F; border-radius: 10px; overflow: hidden; }
.sheet .alarm .ah { background: #A1232F; color: #FFFFFF; padding: 6px 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sheet .alarm .ah b { font-size: 16px; }
.sheet .alarm .ah span { font-size: 12.5px; }
.sheet .letters { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; }
.sheet .lt { padding: 7px 8px 6px; border-right: 1px solid #F0D3D5; text-align: center; }
.sheet .lt:last-child { border-right: 0; }
.sheet .lt b { display: block; font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; color: #A1232F; line-height: 1; }
.sheet .lt span { display: block; font-size: 12px; line-height: 1.25; margin-top: 4px; }
.sheet .alarm .af { background: #FBEAEA; padding: 6px 12px; font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: flex-end; color: #5E1218; }
.sheet .alarm .af .ln { display: inline-block; min-width: 150px; border-bottom: 1.2px solid #C98A8F; font-weight: 700; color: #16302E; padding: 0 3px; }
.sheet .cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; align-items: start; }
.sheet .blk { border-radius: 9px; background: #F4FAF9; padding: 8px 11px 7px; }
.sheet .blk .bh { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
.sheet .blk .bh .ico { background: #028090; color: #FFFFFF; }
.sheet .blk .bh b { font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; color: #013A40; line-height: 1.15; }
.sheet .blk ul.b { font-size: 12.5px; line-height: 1.34; }
.sheet .blk .warn { margin-top: 5px; background: #FCF1E4; color: #6B3F0C; border-radius: 6px; padding: 5px 8px; font-size: 12px; line-height: 1.3; }
.sheet .blk.wide { grid-column: 1 / -1; }
.sheet .blk.cg { background: #EAF5F4; border: 1.5px solid #9FC9C4; }
.sheet .bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; flex-grow: 1; min-height: 0; }
.sheet .sched { border: 1.5px solid #028090; border-radius: 8px; padding: 7px 11px; display: flex; flex-direction: column; min-height: 0; }
.sheet .sched .nt { font-weight: 700; color: #013A40; font-size: 13.5px; margin-bottom: 2px; }
.sheet .sched .row { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: end; gap: 6px; min-height: 25px; border-bottom: 1.2px solid #C8DCD9; font-size: 12.5px; padding-bottom: 2px; }
.sheet .sched .row span { color: #4A6563; font-weight: 600; }
.sheet .sched .row b { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.sheet .leftcol { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.sheet .call { border: 1.5px solid #A85F12; border-radius: 9px; overflow: hidden; }
.sheet .call .ch { background: #A85F12; color: #FFFFFF; font-weight: 700; font-size: 14px; padding: 5px 11px; }
.sheet .call ul { columns: 2; column-gap: 22px; margin: 0; padding: 6px 11px 6px 28px; font-size: 12.5px; line-height: 1.34; }
.sheet .call li { break-inside: avoid; margin-bottom: 2px; }
.sheet .pg > .foot { margin-top: auto; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <a class="home" href="./" aria-label="Kembali ke daftar materi edukasi"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div><h1>Perawatan Stroke di Rumah</h1><p>Leaflet untuk pasien dan keluarga · A4, 2 halaman (bolak-balik)</p></div>
  </div>
  <div class="actions">
    <button class="btn" id="btn-new" type="button">Kosongkan</button>
    <button class="btn primary" id="btn-print2" type="button">Cetak</button>
  </div>
</header>

<div class="layout">
  <div class="viewtoggle seg" role="group" aria-label="Tampilan">
    <button type="button" data-view="form">Isi (opsional)</button><button type="button" data-view="preview">Pratinjau &amp; cetak</button>
  </div>
  <form class="form-col" id="form" autocomplete="off" onsubmit="return false">
    <details class="card" open><summary>Untuk pasien (opsional)</summary><div class="card-body">
      <p class="note">Semua boleh dikosongkan; kolom akan tercetak sebagai garis kosong untuk ditulis tangan.</p>
      <div class="field"><label for="f-nama">Nama pasien</label><input type="text" id="f-nama" data-k="nama"></div>
      <div class="grid2">
        <div class="field"><label for="f-tgl">Tanggal</label><input type="date" id="f-tgl" data-k="tanggal"></div>
        <div class="field"><label for="f-sisi">Sisi tubuh yang lemah</label><select id="f-sisi" data-k="sisi"><option value="">Tidak disebutkan</option><option value="kiri">Kiri</option><option value="kanan">Kanan</option></select></div>
      </div>
      <div class="field"><label for="f-telp">Telepon / WA klinik</label><input type="tel" id="f-telp" data-k="telp"></div>
      <div class="field"><span class="lbl-ui">Jadwal kontrol dan terapi</span>
        <div class="rows">
          <input type="text" data-k="j1" aria-label="Kontrol dokter" placeholder="Kontrol dokter, mis. Senin, 4 Nov 2026">
          <input type="text" data-k="j2" aria-label="Fisioterapi" placeholder="Fisioterapi, mis. Selasa dan Jumat">
          <input type="text" data-k="j3" aria-label="Terapi lain" placeholder="Terapi lain, mis. terapi wicara">
        </div>
      </div>
      <div class="field"><label for="f-cat">Catatan dokter</label><textarea id="f-cat" data-k="catatan" rows="4" placeholder="mis. Makanan dihaluskan, minuman dikentalkan. Target tekanan darah di bawah 130/80."></textarea></div>
      <div class="field"><label for="f-foot">Kaki halaman</label><input type="text" id="f-foot" data-k="footer"></div>
    </div></details>
  </form>
  <section class="preview-col" aria-label="Pratinjau A4">
    <div class="ptools">
      <button class="btn primary" id="btn-print" type="button">Cetak / Simpan PDF</button>
      <button class="btn" id="btn-pdf" type="button">Unduh PDF</button>
    </div>
    <div class="pages" id="pages"><div class="pagebox"><div class="sheet" id="sheet1"></div></div><div class="pagebox"><div class="sheet" id="sheet2"></div></div></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../assets/app.js"></script>
<script>
(function () {
  "use strict";
  const { $, esc, fmtDate } = KKLP;
  const DOKTER = "dr. Caren Andika Surbakti, Sp.KKLP";
  const svg = (d) => `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = {
    pill: svg('<rect x="3" y="9" width="18" height="7" rx="3.5" transform="rotate(-35 12 12.5)"/><path d="M9.6 8.6l4.2 6"/>'),
    eat: svg('<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/>'),
    bed: svg('<path d="M3 18V7M3 13h18v5M21 13a3 3 0 0 0-3-3h-7v3"/><circle cx="7" cy="10.5" r="1.8"/>'),
    move: svg('<circle cx="13" cy="4" r="2"/><path d="M12 7l-2 6h4l1 5"/><path d="M10 13l-3 7"/><path d="M15 10l3 2"/><path d="M8 10l2-3"/>'),
    home: svg('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>'),
    shirt: svg('<path d="M8 3l-5 3 2 4 3-1v12h8V9l3 1 2-4-5-3a4 4 0 0 1-8 0z"/>'),
    wc: svg('<path d="M6 3h12v6H6zM5 9h14a7 7 0 0 1-7 7 7 7 0 0 1-7-7z"/><path d="M9 16l-1 5h8l-1-5"/>'),
    talk: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>'),
    heart: svg('<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
  };
  const blk = (ic, title, items, extra, cls) => `<div class="blk${cls ? " " + cls : ""}"><div class="bh"><div class="ico">${IC[ic]}</div><b>${title}</b></div><ul class="b">${items.map((x) => `<li>${x}</li>`).join("")}</ul>${extra || ""}</div>`;

  function render(st) {
    const s = st.sisi;
    const weak = s ? `sisi ${s} (yang lemah)` : "sisi yang lemah";
    const weakS = s ? `sisi ${s}` : "sisi yang lemah";
    const strong = s ? `sisi ${s === "kiri" ? "kanan" : "kiri"} (yang kuat)` : "sisi yang kuat";
    const armWeak = s ? `lengan ${s}` : "lengan yang lemah";
    const footer = `<div class="foot"><span>${esc(st.footer || "")}<br>Tanda stroke “SeGeRa Ke RS”: Kementerian Kesehatan RI. Layanan gawat darurat 119.</span><span style="white-space:nowrap;align-self:flex-end">Leaflet ini tidak menggantikan<br>nasihat dokter dan terapis.</span></div>`;

    $("#sheet1").innerHTML = `<div class="pg">
      <div class="rh"><div><div class="eyebrow">KEDOKTERAN KELUARGA LAYANAN PRIMER · EDUKASI KELUARGA</div><h1>Perawatan Stroke di Rumah</h1><div class="sub">Panduan untuk pasien dan keluarga setelah stroke</div></div>
        <div class="for"><span>Untuk</span><b>${esc(st.nama || "")}</b><span>Tanggal</span><b>${esc(fmtDate(st.tanggal, "short"))}</b></div></div>
      <div class="alarm">
        <div class="ah"><b>Stroke bisa berulang. SEGERA KE IGD bila muncul tiba-tiba:</b><span>ingat “SeGeRa Ke RS”</span></div>
        <div class="letters">
          <div class="lt"><b>Se</b><span>Senyum tidak simetris</span></div>
          <div class="lt"><b>Ge</b><span>Gerak separuh tubuh melemah</span></div>
          <div class="lt"><b>Ra</b><span>Bicara pelo</span></div>
          <div class="lt"><b>Ke</b><span>Kebas separuh tubuh</span></div>
          <div class="lt"><b>R</b><span>Rabun atau pandangan kabur</span></div>
          <div class="lt"><b>S</b><span>Sakit kepala hebat</span></div>
        </div>
        <div class="af"><span><b>Jangan menunggu gejala hilang.</b> Catat jam gejala mulai. Jangan beri makan atau minum.</span><span>Ambulans <b>119</b></span><span>Telepon / WA klinik <span class="ln">${esc(st.telp || "")}</span></span></div>
      </div>
      <div class="cols2">
        ${blk("pill", "Obat dan pencegahan stroke berulang", [
          "Minum obat setiap hari sesuai resep, termasuk obat pengencer darah, darah tinggi, kolesterol, dan gula.",
          "<b>Jangan berhenti atau mengganti obat sendiri</b>, walaupun sudah merasa baik.",
          "Ukur tekanan darah secara teratur dan catat hasilnya; bawa saat kontrol.",
          "Berhenti merokok, hindari asap rokok, kurangi garam, dan batasi makanan berlemak.",
          "Beri tahu dokter bila ada memar, mimisan, BAB hitam, atau gusi berdarah.",
        ], `<div class="warn">Kotak obat mingguan dan alarm ponsel membantu agar tidak ada obat yang terlewat.</div>`)}
        ${blk("eat", "Makan dan minum dengan aman", [
          "Duduk tegak (badan lurus) saat makan dan <b>tetap duduk 30 menit</b> sesudahnya.",
          "Suapan kecil, makan perlahan, dan jangan sambil bicara atau menonton.",
          `Masukkan makanan dari ${strong}. Periksa sisa makanan di pipi ${weakS}.`,
          "Ikuti saran dokter tentang tekstur: makanan lunak atau dihaluskan, minuman dikentalkan bila perlu.",
          "Jaga kebersihan mulut dan gigi setiap selesai makan.",
        ], `<div class="warn"><b>Lapor dokter</b> bila sering batuk atau tersedak saat makan, suara serak basah setelah minum, demam, atau sesak.</div>`)}
        ${blk("bed", "Posisi tubuh dan mencegah luka tekan", [
          "Bila banyak berbaring, <b>ubah posisi setiap 2 jam</b> (miring kanan, telentang, miring kiri).",
          `Topang ${armWeak} dengan bantal saat duduk dan berbaring agar bahu tidak tertarik dan nyeri.`,
          "Periksa kulit setiap hari, terutama tumit, bokong, punggung, siku, dan telinga. Lapor bila ada kemerahan yang tidak hilang.",
          "Jaga kulit tetap bersih dan kering; seprai rapi tanpa lipatan.",
        ], "", "wide")}
        ${blk("move", "Latihan dan bergerak", [
          "Lakukan latihan dari fisioterapis <b>setiap hari</b>, sedikit demi sedikit tetapi rutin.",
          `Libatkan ${weak} dalam kegiatan sehari-hari, mis. ikut memegang gelas atau menyisir rambut.`,
          `<b>Jangan menarik ${armWeak}</b> saat membantu bangun atau berpindah; pegang di badan atau pinggang.`,
          "Gerakkan sendi yang lemah perlahan beberapa kali sehari bila belum bisa bergerak sendiri.",
          "Gunakan alat bantu jalan sesuai anjuran terapis.",
        ])}
        ${blk("home", "Rumah aman, cegah jatuh", [
          "Singkirkan karpet licin, kabel, dan barang di lantai.",
          "Pasang pegangan di kamar mandi dan dekat toilet; pakai kursi mandi.",
          "Lampu malam menuju kamar mandi; alas kaki tertutup dan tidak licin.",
          "Letakkan barang yang sering dipakai dalam jangkauan; tempat tidur tidak terlalu tinggi.",
          "Bila memungkinkan, kamar tidur di lantai bawah.",
        ])}
      </div>
      ${footer.replace("</span><span", ` · Halaman 1 / 2</span><span`)}
    </div>`;

    const row = (l, k) => `<div class="row"><span>${l}</span><b>${esc(st[k] || "")}</b></div>`;
    $("#sheet2").innerHTML = `<div class="pg">
      <div class="rh slim"><div><div class="eyebrow">PERAWATAN STROKE DI RUMAH</div><h1>Aktivitas sehari-hari dan dukungan keluarga</h1></div>
        <div class="for"><span>Untuk</span><b>${esc(st.nama || "")}</b></div></div>
      <div class="cols2">
        ${blk("shirt", "Mandiri dalam aktivitas sehari-hari", [
          "Biarkan pasien melakukan sendiri sebisa mungkin; bantu hanya bagian yang belum bisa.",
          `Berpakaian: <b>pakai mulai dari ${weakS}</b>, lepas mulai dari ${strong.replace(" (yang kuat)", "")}.`,
          "Pilih baju longgar berkancing depan, celana karet, dan sandal bertali perekat.",
          "Mandi sambil duduk; cek suhu air dengan tangan yang tidak lemah.",
        ])}
        ${blk("wc", "Buang air kecil dan besar", [
          "Ajak ke toilet secara terjadwal, mis. setiap 2–3 jam dan sebelum tidur.",
          "Cukup minum, kecuali dokter membatasi cairan.",
          "Cegah sembelit: sayur, buah, cukup minum, dan bergerak.",
          "Lapor dokter bila nyeri saat BAK, urine keruh atau berbau, atau tidak BAB lebih dari 3 hari.",
        ])}
        ${blk("talk", "Bicara dan perasaan", [
          "Bicara pelan dengan kalimat pendek; beri waktu pasien untuk menjawab.",
          "Gunakan isyarat, gambar, atau papan tulis bila sulit bicara.",
          "Sedih, mudah menangis, atau marah sering terjadi setelah stroke. <b>Murung lebih dari 2 minggu? Bicarakan dengan dokter.</b>",
        ])}
        ${blk("heart", "Untuk keluarga dan pelaku rawat", [
          "Bagi tugas merawat dengan anggota keluarga lain; jangan merawat sendirian.",
          "Luangkan waktu untuk istirahat, makan, dan ibadah Anda sendiri.",
          "Minta bantuan tetangga, komunitas, atau tenaga kesehatan bila lelah atau kewalahan.",
        ], "", "cg")}
      </div>
      <div class="call"><div class="ch">Hubungi dokter bila:</div><ul>
        <li>Demam, batuk berdahak, atau sesak napas</li><li>Sering batuk atau tersedak saat makan dan minum</li>
        <li>Kulit merah yang tidak hilang atau luka di tumit dan bokong</li><li>Jatuh, walaupun tampak tidak terluka</li>
        <li>Nyeri bahu atau bengkak pada lengan dan tungkai yang lemah</li><li>Tidak BAB lebih dari 3 hari, atau nyeri saat BAK</li>
        <li>Tekanan darah atau gula darah di luar target berulang kali</li><li>Murung, tidak mau makan, atau sulit tidur lebih dari 2 minggu</li></ul></div>
      <div class="bottom">
        <div class="leftcol"><div class="sched"><div class="nt">Jadwal kontrol dan terapi</div>${row("Kontrol dokter", "j1")}${row("Fisioterapi", "j2")}${row("Terapi lain", "j3")}</div>
        <div class="sched" style="flex-grow:1"><div class="nt">Kontak penting</div><div class="row"><span>Klinik / dokter</span><b>${esc(st.telp || "")}</b></div><div class="row"><span>Ambulans</span><b>119</b></div><div class="row"><span>Fisioterapis</span><b></b></div><div class="row"><span>Keluarga</span><b></b></div></div></div>
        <div class="note"><div class="nt">Catatan dokter</div><div class="tx">${esc(st.catatan || "")}</div></div>
      </div>
      ${footer.replace("</span><span", ` · Halaman 2 / 2</span><span`)}
    </div>`;
  }
  function defaults() { return { tanggal: "", footer: "Edukasi Pasien - " + DOKTER }; }
  KKLP.docTool({ key: "edukasi-stroke", defaults, sample: () => ({}), render });
  $("#btn-print2").addEventListener("click", () => $("#btn-print").click());
})();
</script>
</body>
</html>

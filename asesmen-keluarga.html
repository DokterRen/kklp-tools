<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asesmen Keluarga</title>
<meta name="description" content="APGAR Keluarga, SCREEM, dan siklus hidup keluarga dengan skor otomatis dan ringkasan A4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/instrumen.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <a class="home" href="./" aria-label="Kembali ke beranda"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></a>
    <div><h1>Asesmen Keluarga</h1><p>APGAR Keluarga, SCREEM, dan siklus hidup keluarga</p></div>
  </div>
  <div class="actions">
    <button class="btn" id="btn-new" type="button">Asesmen baru</button>
    <button class="btn" id="btn-sample" type="button">Contoh</button>
    <button class="btn primary" id="btn-archive" type="button">Simpan ke daftar pasien</button>
  </div>
</header>

<div class="layout">
  <div class="viewtoggle seg" role="group" aria-label="Tampilan">
    <button type="button" data-view="form">Isi data</button><button type="button" data-view="preview">Ringkasan &amp; cetak</button>
  </div>
  <form class="form-col" id="form" autocomplete="off" onsubmit="return false">
    <div class="idhint" id="idhint" hidden></div>
    <details class="card"><summary>Daftar pasien tersimpan <span class="count" id="arsip-count">0</span></summary><div class="card-body">
      <input type="search" id="arsip-cari" placeholder="Cari nama atau No. RM" aria-label="Cari pasien">
      <div class="archive" id="archive"></div>
      <div class="checks"><button class="btn sm" type="button" id="btn-json">Simpan file data (.json)</button><button class="btn sm" type="button" id="btn-open">Buka file data</button></div>
      <p class="note">Daftar ini hanya tersimpan di browser perangkat ini.</p>
    </div></details>
    <div id="sections"></div>
    <input type="file" id="file-in" accept=".json,application/json" class="sr" tabindex="-1" aria-hidden="true">
  </form>

  <section class="preview-col" aria-label="Ringkasan">
    <div class="ptools">
      <button class="btn primary" id="btn-print" type="button">Cetak / Simpan PDF</button>
      <button class="btn" id="btn-pdf" type="button">Unduh PDF</button>
    </div>
    <div class="pages" id="pages"><div class="pagebox"><div class="sheet" id="sheet1"></div></div></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/app.js"></script>
<script src="assets/instrumen.js"></script>
<script>
(function () {
  "use strict";
  const { $, $$, esc, today } = KKLP;
  const { radios, card, pill, fmt1, has, num, none, identity, head, foot, notes } = KKLP_I;
  const DOKTER = "dr. Caren Andika Surbakti, Sp.KKLP";

  // Family APGAR (Smilkstein 1978)
  const APGAR = [
    ["A", "Adaptation", "Saya puas bahwa saya dapat kembali kepada keluarga saya untuk meminta bantuan bila saya menghadapi masalah."],
    ["P", "Partnership", "Saya puas dengan cara keluarga saya membicarakan berbagai hal dengan saya dan berbagi masalah dengan saya."],
    ["G", "Growth", "Saya puas bahwa keluarga saya menerima dan mendukung keinginan saya untuk melakukan kegiatan baru atau mengubah arah hidup."],
    ["A", "Affection", "Saya puas dengan cara keluarga saya mengungkapkan kasih sayang dan menanggapi perasaan saya, seperti marah, sedih, atau cinta."],
    ["R", "Resolve", "Saya puas dengan cara keluarga saya dan saya meluangkan waktu bersama."],
  ];
  const APGAR_OPT = [["2", "Hampir selalu"], ["1", "Kadang-kadang"], ["0", "Hampir tidak pernah"]];
  const apgarCat = (t) => (t >= 7 ? ["Fungsi keluarga baik", "#3E9B3A"] : t >= 4 ? ["Disfungsi keluarga sedang", "#C98A00"] : ["Disfungsi keluarga berat", "#B3363F"]);
  const SCREEM = [
    ["S", "Sosial", "interaksi dengan keluarga besar, tetangga, teman, komunitas"],
    ["C", "Budaya (Cultural)", "nilai, tradisi, dan kebanggaan budaya yang mendukung atau menghambat"],
    ["R", "Agama (Religious)", "pengamalan agama dan dukungan komunitas keagamaan"],
    ["E", "Ekonomi", "kecukupan penghasilan, pekerjaan, jaminan kesehatan"],
    ["E", "Pendidikan (Educational)", "pendidikan dan pengetahuan untuk memahami masalah kesehatan"],
    ["M", "Medis", "akses dan pemanfaatan layanan kesehatan"],
  ];
  const STAGES = [
    ["Keluarga baru menikah", "Pasangan menikah, belum mempunyai anak", ["Membangun pernikahan yang saling memuaskan", "Menyesuaikan diri dengan keluarga besar masing-masing", "Merencanakan keluarga (KB, persiapan kehamilan)"]],
    ["Keluarga dengan bayi", "Anak tertua berusia 0–30 bulan", ["Beradaptasi dengan peran sebagai orang tua", "Merawat bayi sambil menjaga hubungan suami-istri", "Imunisasi, ASI, dan pemantauan tumbuh kembang"]],
    ["Keluarga dengan anak prasekolah", "Anak tertua berusia 2,5–6 tahun", ["Memenuhi kebutuhan dan memberi stimulasi anak", "Membantu sosialisasi anak", "Mengatur jarak kelahiran dan mengatasi kelelahan orang tua"]],
    ["Keluarga dengan anak usia sekolah", "Anak tertua berusia 6–13 tahun", ["Mendukung prestasi sekolah dan pergaulan anak", "Menjaga keharmonisan suami-istri", "Kesehatan anak sekolah dan pencegahan cedera"]],
    ["Keluarga dengan anak remaja", "Anak tertua berusia 13–20 tahun", ["Menyeimbangkan kebebasan dan tanggung jawab remaja", "Menjaga komunikasi terbuka orang tua–anak", "Mencegah perilaku berisiko (rokok, NAPZA, seks bebas)"]],
    ["Keluarga melepas anak dewasa", "Anak pertama hingga terakhir meninggalkan rumah", ["Melepas anak dengan dukungan yang cukup", "Menerima menantu dan cucu ke dalam keluarga", "Menata kembali peran dan hubungan suami-istri"]],
    ["Keluarga usia pertengahan", "Rumah kosong hingga pensiun", ["Memperkuat hubungan suami-istri", "Menjaga hubungan dengan generasi tua dan muda", "Mencegah dan mengelola penyakit kronis"]],
    ["Keluarga usia lanjut", "Pensiun hingga kedua pasangan meninggal", ["Menyesuaikan diri dengan pensiun dan penurunan fungsi", "Menghadapi kehilangan pasangan, saudara, dan teman", "Mempertahankan kemandirian dan merencanakan akhir hayat"]],
  ];
  const resp = (i) => `<div class="field"><label for="ap-n${i}">Responden ${i + 1}</label><input type="text" id="ap-n${i}" data-k="apN${i}" placeholder="${i === 0 ? "mis. Pasien (Bapak S)" : "kosongkan bila tidak ada"}"></div>`;
  $("#sections").innerHTML =
    card("id", 0, "Identitas", identity() + `<div class="field"><label for="f-kel">Keluarga</label><input type="text" id="f-kel" data-k="keluarga" placeholder="mis. Keluarga Bapak S"></div>`, true) +
    card("apgar", 1, "APGAR Keluarga", `
      <p class="intro">Diisi oleh satu atau beberapa anggota keluarga (maks. 3) untuk membandingkan persepsi fungsi keluarga.</p>
      <div class="grid3">${[0, 1, 2].map(resp).join("")}</div>
      ${APGAR.map(([L, dom, t], i) => `<div class="q"><div class="qt"><span class="dom">${L}</span>${t} <span class="note">(${dom})</span></div>
        ${[0, 1, 2].map((r) => `<div class="resp" data-resp="${r}"><b data-rn="${r}">Responden ${r + 1}</b>${radios("ap" + r + "_" + i, APGAR_OPT, "three")}</div>`).join("")}</div>`).join("")}
      <div class="score" id="sc-apgar"></div>`, true) +
    card("screem", 2, "SCREEM", `<p class="intro">Tuliskan sumber daya yang dimiliki keluarga dan masalah (patologi) pada setiap aspek. Singkat saja.</p>
      <div class="screem">${SCREEM.map(([L, name, hint], i) => `<div class="h">${L} · ${name} <small>${hint}</small></div>
        <textarea data-k="sc${i}r" rows="2" aria-label="${name}: sumber daya" placeholder="Sumber daya"></textarea><textarea data-k="sc${i}p" rows="2" aria-label="${name}: masalah" placeholder="Masalah / patologi"></textarea>`).join("")}</div>
      <div class="score" id="sc-screem"></div>`) +
    card("siklus", 3, "Siklus hidup keluarga (Duvall)", `
      <div class="stage" role="radiogroup">${STAGES.map(([nm, d], i) => `<label class="opt"><input type="radio" name="tahap" data-k="tahap" value="${i}"><span><b>Tahap ${i + 1}. ${nm}</b><small>${d}</small></span></label>`).join("")}</div>
      <div class="tasks" id="tasks"></div>
      <div class="field"><label for="f-tahapc">Catatan: tugas perkembangan yang belum tercapai, atau tahap yang tumpang tindih</label><textarea id="f-tahapc" data-k="tahapCat" rows="2"></textarea></div>`) +
    card("kes", 0, "Kesimpulan dan rencana", `<div class="field"><label for="f-kes">Kesimpulan asesmen keluarga dan rencana tindak lanjut</label><textarea id="f-kes" data-k="kesimpulan" rows="5"></textarea></div>
      <div class="field"><label for="f-foot">Kaki halaman</label><input type="text" id="f-foot" data-k="footer"></div>`);

  function score(st) {
    const R = {};
    R.apgar = [0, 1, 2].map((r) => {
      const name = (st["apN" + r] || "").trim() || (r === 0 ? "Responden 1" : "");
      const vals = APGAR.map((_, i) => (has(st, "ap" + r + "_" + i) ? num(st, "ap" + r + "_" + i) : null));
      const answered = vals.filter((v) => v !== null).length;
      return { name, vals, answered, total: answered === 5 ? vals.reduce((a, b) => a + b, 0) : null, active: r === 0 || !!(st["apN" + r] || "").trim() || answered > 0 };
    }).filter((x) => x.active);
    R.screem = SCREEM.map((_, i) => ({ r: (st["sc" + i + "r"] || "").trim(), p: (st["sc" + i + "p"] || "").trim() }));
    R.screemFilled = R.screem.filter((x) => x.r || x.p).length;
    R.screemPat = R.screem.map((x, i) => (x.p ? SCREEM[i][1].split(" ")[0] : null)).filter(Boolean);
    R.tahap = has(st, "tahap") ? num(st, "tahap") : null;
    return R;
  }
  function render(st) {
    const R = score(st);
    $$("[data-resp]").forEach((row) => {
      const r = Number(row.dataset.resp), name = (st["apN" + r] || "").trim();
      row.hidden = r > 0 && !name; row.querySelector("[data-rn]").textContent = name || "Responden " + (r + 1);
    });
    $("#sc-apgar").innerHTML = R.apgar.map((a) => `<span>${esc(a.name)}: ${a.total === null ? `<span class="note">${a.answered}/5 terjawab</span>` : `<b>${a.total}</b>/10 · ${apgarCat(a.total)[0]}`}</span>`).join("");
    $("#cnt-apgar").textContent = R.apgar.map((a) => (a.total === null ? "–" : a.total)).join(" · ");
    $("#sc-screem").innerHTML = `<span>${R.screemFilled}/6 aspek terisi</span>` + (R.screemPat.length ? `<span>Masalah pada: <b style="font-size:14px">${esc(R.screemPat.join(", "))}</b></span>` : "");
    $("#cnt-screem").textContent = R.screemFilled + "/6";
    $("#tasks").innerHTML = R.tahap === null ? `<span class="note">Pilih tahap untuk melihat tugas perkembangannya.</span>` : `<b>Tugas perkembangan tahap ${R.tahap + 1}:</b><ul>${STAGES[R.tahap][2].map((t) => `<li>${t}</li>`).join("")}</ul>`;
    $("#cnt-siklus").textContent = R.tahap === null ? "" : "Tahap " + (R.tahap + 1);

    const cite = "APGAR Keluarga dan SCREEM: Smilkstein · Siklus hidup keluarga: Duvall. Terjemahan tidak resmi.";
    const rows = [];
    R.apgar.forEach((a) => rows.push(["APGAR Keluarga", esc(a.name), a.total === null ? none : a.total + " / 10", a.total === null ? "" : pill(apgarCat(a.total))]));
    rows.push(["SCREEM", "", R.screemFilled ? R.screemFilled + " / 6 aspek" : none, R.screemFilled ? (R.screemPat.length ? "Masalah: " + esc(R.screemPat.join(", ")) : "Tidak ada masalah tercatat") : ""]);
    rows.push(["Siklus hidup keluarga", "", R.tahap === null ? none : "Tahap " + (R.tahap + 1), R.tahap === null ? "" : esc(STAGES[R.tahap][0])]);
    const apCols = R.apgar.length;
    const apTable = `<table class="t"><colgroup><col style="width:28px"><col>${R.apgar.map(() => `<col style="width:${apCols === 1 ? 110 : 92}px">`).join("")}</colgroup>
      <thead><tr><th class="c"></th><th>Komponen</th>${R.apgar.map((a) => `<th class="c" style="padding:4px 3px">${esc(a.name)}</th>`).join("")}</tr></thead><tbody>` +
      APGAR.map(([L, dom, t], i) => `<tr><td class="c"><b>${L}</b></td><td><b>${dom}</b> · <span style="color:#4A6563">${esc(t)}</span></td>${R.apgar.map((a) => `<td class="c">${a.vals[i] === null ? "–" : a.vals[i]}</td>`).join("")}</tr>`).join("") +
      `<tr class="tot"><td></td><td>Total (7–10 baik · 4–6 disfungsi sedang · 0–3 disfungsi berat)</td>${R.apgar.map((a) => `<td class="c">${a.total === null ? "–" : a.total}</td>`).join("")}</tr></tbody></table>`;
    const scTable = `<table class="t"><colgroup><col style="width:22%"><col><col></colgroup><thead><tr><th>Aspek</th><th>Sumber daya</th><th>Masalah / patologi</th></tr></thead><tbody>` +
      SCREEM.map(([L, name], i) => `<tr><td><b>${L}</b> · ${name}</td><td><div class="cell" data-fit="9" style="max-height:34px">${esc(R.screem[i].r) || "<span class='muted'>–</span>"}</div></td><td><div class="cell" data-fit="9" style="max-height:34px">${esc(R.screem[i].p) || "<span class='muted'>–</span>"}</div></td></tr>`).join("") + `</tbody></table>`;
    const stageBox = R.tahap === null ? `<div class="box">${none}</div>` : `<div class="box"><b>Tahap ${R.tahap + 1}. ${STAGES[R.tahap][0]}</b> <span style="color:#4A6563">(${STAGES[R.tahap][1]})</span><ul>${STAGES[R.tahap][2].map((t) => `<li>${t}</li>`).join("")}</ul>${st.tahapCat ? `<div style="margin-top:4px"><b>Catatan:</b> <span class="cell" data-fit="9" style="display:block;max-height:34px">${esc(st.tahapCat)}</span></div>` : ""}</div>`;
    $("#sheet1").innerHTML = `<div class="pg">${head(st, "Ringkasan Asesmen Keluarga", esc(st.keluarga || ""))}
      <section><h2>Ringkasan</h2><table class="t"><colgroup><col style="width:27%"><col style="width:20%"><col style="width:17%"><col></colgroup>
        <thead><tr><th>Instrumen</th><th>Responden</th><th>Skor / hasil</th><th>Interpretasi</th></tr></thead><tbody>${rows.map((r) => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></section>
      <section><h2><span class="num">1</span>APGAR Keluarga <small>Hampir selalu = 2 · Kadang-kadang = 1 · Hampir tidak pernah = 0</small></h2>${apTable}</section>
      <section><h2><span class="num">2</span>SCREEM</h2>${scTable}</section>
      <section><h2><span class="num">3</span>Siklus Hidup Keluarga (Duvall)</h2>${stageBox}</section>
      ${notes(st, "kesimpulan", "Kesimpulan dan Rencana")}
      ${foot(st, cite)}</div>`;
  }
  function defaults() { return { tanggal: today(), apN0: "Pasien", footer: "Asesmen Keluarga - " + DOKTER }; }
  function sample() {
    const s = { nama: "Bapak S (contoh)", rm: "12-34-56", usia: "64", keluarga: "Keluarga Bapak S", apN0: "Bapak S", apN1: "Ibu R", apN2: "Dewi",
      tahap: "6", tahapCat: "Anak bungsu (Dewi) masih tinggal serumah dan menjadi pelaku rawat utama.",
      kesimpulan: "Fungsi keluarga menurun terutama pada komponen partnership dan resolve; konflik suami-istri sejak stroke. Dewi menjadi pelaku rawat tunggal.\nRencana: konferensi keluarga dengan Budi; libatkan pengajian untuk dukungan antar-jemput; edukasi Ibu R tentang penyakit kronis." };
    [[2, 1, 1, 1, 1], [1, 0, 1, 1, 0], [2, 1, 2, 2, 1]].forEach((r, i) => r.forEach((v, j) => { s["ap" + i + "_" + j] = String(v); }));
    [["Aktif di pengajian; tetangga baik", "Budi tinggal jauh dan jarang berkunjung"], ["", ""], ["Keluarga taat beribadah, pengajian bersedia membantu", ""],
     ["Pensiun PNS, BPJS aktif", "Biaya fisioterapi dan transportasi menambah beban"], ["Dewi lulusan D3, mudah menerima edukasi", "Ibu R kurang memahami penyakit kronis"],
     ["Dekat dengan puskesmas (PRB)", "Fisioterapi di RS sulit dijangkau tanpa kendaraan"]].forEach((r, i) => { s["sc" + i + "r"] = r[0]; s["sc" + i + "p"] = r[1]; });
    return s;
  }
  KKLP.docTool({ key: "asesmen-keluarga", defaults, sample, render });

})();
</script>
</body>
</html>

<style>
/* Layout: editor column (the "anamnesis") beside a paper stage where the diagrams are drawn; stacks on phones. */
:root {
  --bg: #F3F7F6;
  --surface: #FFFFFF;
  --surface-2: #E9F3F1;
  --line: #CFE2DF;
  --ink: #16302E;
  --muted: #557370;
  --deep: #013A40;
  --teal: #028090;
  --teal-ink: #FFFFFF;
  --focus: #00A896;
  --danger: #B3363F;
  --danger-bg: #FBEAEA;
  --paper: #FFFFFF;
  --paper-edge: #D5E4E1;
  --font-ui: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-display: "Source Serif 4", Georgia, "Times New Roman", serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1B1C; --surface: #132628; --surface-2: #1A3335; --line: #2A4547; --ink: #E3EFED; --muted: #9DBAB6;
    --deep: #8FD8CF; --teal: #22A6A0; --teal-ink: #04201F; --focus: #5FD3C6; --danger: #F08A8F; --danger-bg: #3A1D20;
    --paper: #FFFFFF; --paper-edge: #2A4547; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1B1C; --surface: #132628; --surface-2: #1A3335; --line: #2A4547; --ink: #E3EFED; --muted: #9DBAB6;
  --deep: #8FD8CF; --teal: #22A6A0; --teal-ink: #04201F; --focus: #5FD3C6; --danger: #F08A8F; --danger-bg: #3A1D20;
  --paper: #FFFFFF; --paper-edge: #2A4547; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex-shrink: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-size: 21px; color: var(--deep); text-wrap: balance; }
.brand p { margin: 0; font-size: 13px; color: var(--muted); }
.top .actions { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--teal); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: var(--teal-ink); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger-bg); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: 13px; }

.layout { display: grid; grid-template-columns: minmax(340px, 420px) minmax(0, 1fr); gap: 16px; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } .stage { order: -1; } }

.editor { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
details.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.card > summary { list-style: none; cursor: pointer; padding: 11px 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; color: var(--deep); }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary .count { margin-left: auto; font-weight: 600; font-size: 12.5px; color: var(--muted); }
details.card > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details.card[open] > summary::before { transform: rotate(45deg); }
.card-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }

.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label, .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
.field input[type=text], .field input[type=number], .field input[type=date], .field select, .field textarea, .row select, .row input[type=text] {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 8px; }
.field textarea { resize: vertical; min-height: 54px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--teal); color: var(--teal-ink); }

.members { display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow: auto; }
.mrow { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; background: transparent; text-align: left; width: 100%; }
.mrow:hover { background: var(--surface-2); }
.mrow[aria-current="true"] { background: var(--surface-2); border-color: var(--teal); }
.mrow .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .meta { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.gen-h { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 2px; }
.medit { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12.5px; background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.chip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

.list { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; gap: 6px; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 8px; }
.row.union { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 70px auto; }
.row.rel { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) auto; }
.row.eco { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto; }
.row.eco .sub { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.row .who { font-size: 13.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 0; background: transparent; color: var(--danger); cursor: pointer; font-size: 18px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.x:hover { background: var(--danger-bg); }
.empty { font-size: 13.5px; color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

.stage { min-width: 0; display: flex; flex-direction: column; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); }
@media (max-width: 980px) { .stage { position: static; } }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px; }
.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 7px; cursor: pointer; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--deep); color: var(--surface); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.toolbar .sp { flex: 1 1 auto; }
.canvas-wrap { background: var(--paper); border: 1px solid var(--paper-edge); border-radius: var(--r); overflow: auto; height: max(420px, calc(100vh - 200px)); touch-action: pan-x pan-y; }
@media (max-width: 980px) { .canvas-wrap { height: min(72vh, 620px); min-height: 340px; } }
#canvas svg { display: block; margin: 0 auto; }
#canvas [data-node] { cursor: grab; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--deep); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; z-index: 20; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="2" y="3" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--teal)"/><circle cx="26" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--teal)"/><path d="M7.5 14v4h18.5v-4M17 18v5" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--teal)"/><circle cx="17" cy="28" r="4.5" fill="currentColor" style="color: var(--deep)"/></svg>
    <div>
      <h1>Genogram &amp; Ekomap Keluarga</h1>
      <p>Genogram, peta keluarga, dan ekomap untuk asesmen dan presentasi kasus</p>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="btn-new" type="button">Kasus baru</button>
    <button class="btn" id="btn-sample" type="button">Muat contoh</button>
    <button class="btn" id="btn-open" type="button">Buka file kasus</button>
    <button class="btn primary" id="btn-savejson" type="button">Simpan file kasus</button>
  </div>
</header>

<div class="layout">
  <aside class="editor" id="editor" aria-label="Data keluarga"></aside>
  <section class="stage" aria-label="Diagram">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" id="tab-geno" data-tab="geno" type="button">Genogram</button>
      <button role="tab" id="tab-map" data-tab="map" type="button">Peta keluarga</button>
      <button role="tab" id="tab-eco" data-tab="eco" type="button">Ekomap</button>
      <button role="tab" id="tab-sheet" data-tab="sheet" type="button">Lembar presentasi</button>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Perbesaran">
        <button type="button" id="z-out" aria-label="Perkecil">−</button>
        <button type="button" id="z-fit" aria-pressed="true">Pas</button>
        <button type="button" id="z-in" aria-label="Perbesar">+</button>
      </div>
      <button class="btn sm" id="btn-reset" type="button">Rapikan otomatis</button>
      <span class="sp"></span>
      <button class="btn sm" id="ex-png" type="button">Unduh PNG</button>
      <button class="btn sm" id="ex-svg" type="button">Unduh SVG</button>
      <button class="btn sm primary" id="ex-pdf" type="button">Unduh PDF (4 halaman)</button>
    </div>
    <div class="canvas-wrap" id="wrap"><div id="canvas"></div></div>
    <p class="hint" id="hint">Klik simbol untuk mengedit anggota. Seret simbol untuk merapikan posisi; “Rapikan otomatis” mengembalikan tata letak awal.</p>
  </section>
</div>
<input type="file" id="file-in" accept=".json,application/json" class="sr" tabindex="-1" aria-hidden="true">
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
"use strict";
const DOCTOR = "dr. Caren Andika Surbakti, Sp.KKLP";
const LS_KEY = "genogram-kasus-v1";
const FONT = "Arial, Helvetica, sans-serif";
const INK = "#16302E", MUTED = "#557370", TEAL = "#028090", DEEP = "#013A40", RED = "#C0392B";
const MARKER_COLORS = ["#E07A1F", "#C23B3B", "#6A4FB3", "#1F7FB8", "#2E8B57", "#B8860B"];
const REL_TYPES = [
  ["close", "Dekat"], ["fused", "Sangat lekat"], ["distant", "Renggang"],
  ["conflict", "Konflik"], ["closeConflict", "Dekat tapi konflik"], ["cutoff", "Terputus"],
];
const UNION_STATUS = [["married", "Menikah"], ["divorced", "Bercerai"], ["separated", "Berpisah"], ["cohabit", "Tinggal bersama"]];
const ECO_CAT = ["Kesehatan", "Pekerjaan", "Sekolah", "Agama", "Keluarga besar", "Teman/tetangga", "Komunitas", "Keuangan/jaminan", "Layanan sosial", "Rekreasi", "Lainnya"];
const ECO_CAT_COLOR = { "Kesehatan": "#028090", "Pekerjaan": "#8A5A2B", "Sekolah": "#3B6FB6", "Agama": "#6A4FB3", "Keluarga besar": "#B5486A", "Teman/tetangga": "#2E8B57", "Komunitas": "#2E8B57", "Keuangan/jaminan": "#B8860B", "Layanan sosial": "#1F7FB8", "Rekreasi": "#D2691E", "Lainnya": "#557370" };
const ECO_STRENGTH = [["strong", "Kuat"], ["moderate", "Sedang"], ["weak", "Lemah"], ["stress", "Menekan"]];
const ECO_DIR = [["to", "Ke keluarga"], ["from", "Dari keluarga"], ["both", "Dua arah"], ["none", "Tanpa arah"]];

const uid = (p) => p + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const avg = (a) => a.reduce((s, v) => s + v, 0) / (a.length || 1);
const $ = (sel, root) => (root || document).querySelector(sel);

/* ------------------------------------------------------------------ data */
function blankCase() {
  const idx = mk({ name: "Pasien", sex: "M", age: "", index: true, house: true, order: 1 });
  return {
    v: 1, title: "Keluarga baru", date: today(), presenter: DOCTOR, notes: "", initials: false,
    members: [idx], unions: [], relations: [], eco: [],
    markers: defaultMarkers(), mapPos: {}, ecoPos: {},
  };
}
function defaultMarkers() {
  return [
    { name: "DM", keys: "DM, diabetes", color: MARKER_COLORS[0] },
    { name: "Hipertensi", keys: "hipertensi, HT", color: MARKER_COLORS[1] },
    { name: "Stroke", keys: "stroke", color: MARKER_COLORS[2] },
    { name: "Penyakit jantung", keys: "jantung, PJK, CHF, gagal jantung", color: MARKER_COLORS[3] },
  ];
}
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
let orderSeq = 100;
function mk(o) {
  return Object.assign({ id: uid("m"), name: "", sex: "M", age: "", dead: false, deathAge: "", cause: "", cond: "", note: "",
    index: false, house: false, cg: false, pk: false, adopted: false, unknown: false, unionId: null, order: orderSeq++, dx: 0 }, o);
}
function sampleCase() {
  const c = { v: 1, title: "Keluarga Bapak S (contoh)", date: today(), presenter: DOCTOR,
    notes: "Contoh kasus: pasca stroke iskemik dengan caregiver tunggal. Ganti dengan data pasien Anda.", initials: false,
    members: [], unions: [], relations: [], eco: [], markers: defaultMarkers(), mapPos: {}, ecoPos: {} };
  const M = (o) => { const m = mk(o); c.members.push(m); return m; };
  const U = (a, b, o) => { const u = Object.assign({ id: uid("u"), a: a.id, b: b.id, status: "married", year: "" }, o || {}); c.unions.push(u); return u; };
  const fa = M({ name: "Ayah Bpk S", sex: "M", dead: true, deathAge: "62", cause: "stroke", order: 1 });
  const mo = M({ name: "Ibu Bpk S", sex: "F", age: "84", cond: "DM", order: 2 });
  const fr = M({ name: "Ayah Ibu R", sex: "M", dead: true, deathAge: "70", cause: "PJK", order: 3 });
  const mr = M({ name: "Ibu dari Ibu R", sex: "F", age: "82", cond: "Hipertensi", order: 4 });
  const u1 = U(fa, mo), u2 = U(fr, mr);
  M({ name: "Kakak", sex: "M", age: "67", cond: "Hipertensi", note: "perokok", unionId: u1.id, order: 5 });
  const s = M({ name: "Bapak S", sex: "M", age: "64", cond: "DM, Hipertensi, Stroke", index: true, house: true, unionId: u1.id, order: 6 });
  const r = M({ name: "Ibu R", sex: "F", age: "60", cond: "Hipertensi", note: "nyeri lutut", house: true, unionId: u2.id, order: 7 });
  const u3 = U(s, r, { year: "1988" });
  const b = M({ name: "Budi", sex: "M", age: "35", cond: "obesitas", note: "tinggal di Jakarta", pk: true, unionId: u3.id, order: 8 });
  const d = M({ name: "Dewi", sex: "F", age: "30", note: "bekerja", house: true, cg: true, unionId: u3.id, order: 9 });
  const sa = M({ name: "Sari", sex: "F", age: "33", order: 10 });
  const u4 = U(b, sa, { year: "2017" });
  M({ name: "Rafa", sex: "M", age: "6", unionId: u4.id, order: 11 });
  c.relations = [
    { id: uid("r"), a: s.id, b: r.id, type: "conflict" },
    { id: uid("r"), a: s.id, b: d.id, type: "close" },
    { id: uid("r"), a: r.id, b: d.id, type: "close" },
    { id: uid("r"), a: s.id, b: b.id, type: "distant" },
  ];
  const E = (label, cat, strength, dir, note) => c.eco.push({ id: uid("e"), label, cat, strength, dir, note: note || "" });
  E("Puskesmas / PRB", "Kesehatan", "strong", "to");
  E("Poli saraf & fisioterapi RS", "Kesehatan", "strong", "to");
  E("Pengajian", "Agama", "strong", "both", "bisa bantu antar-jemput");
  E("Tetangga", "Teman/tetangga", "weak", "to");
  E("Kantor Dewi", "Pekerjaan", "stress", "from", "izin sulit");
  E("Budi (Jakarta)", "Keluarga besar", "weak", "to");
  E("BPJS Kesehatan", "Keuangan/jaminan", "strong", "to");
  return c;
}

let state;
try { const raw = localStorage.getItem(LS_KEY); if (raw) state = normalize(JSON.parse(raw)); } catch (e) { state = null; }
if (!state) state = sampleCase();
let ui = { tab: "geno", sel: (state.members.find((m) => m.index) || state.members[0] || {}).id, zoom: "fit", openMember: true };

function normalize(c) {
  if (!c || !Array.isArray(c.members)) throw new Error("bad");
  const d = blankCase();
  const out = Object.assign(d, c);
  out.members = c.members.map((m) => mk(m));
  out.unions = (c.unions || []).filter((u) => u && u.id);
  out.relations = c.relations || [];
  out.eco = c.eco || [];
  out.markers = (c.markers && c.markers.length) ? c.markers : defaultMarkers();
  out.mapPos = c.mapPos || {}; out.ecoPos = c.ecoPos || {};
  orderSeq = Math.max(orderSeq, ...out.members.map((m) => Number(m.order) || 0)) + 1;
  return out;
}
let saveTimer = null;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } }, 300);
}

/* ----------------------------------------------------------- relations */
const byId = (id) => state.members.find((m) => m.id === id);
const unionsOf = (id) => state.unions.filter((u) => u.a === id || u.b === id);
const partnerIn = (u, id) => (u.a === id ? u.b : u.a);
const kidsOf = (uId) => state.members.filter((m) => m.unionId === uId).sort((a, b) => a.order - b.order);
function shortName(m) { return m ? (m.name || "tanpa nama") : "?"; }
function initials(name) {
  const w = String(name || "").replace(/\(.*?\)/g, "").trim().split(/\s+/).filter(Boolean);
  if (!w.length) return "?";
  return w.map((x) => x[0].toUpperCase()).join("").slice(0, 3);
}
function disp(m) { if (!m) return ""; if (m.unknown) return "Tidak diketahui"; return state.initials ? initials(m.name) : (m.name || "tanpa nama"); }
function unionLabel(u) { return disp(byId(u.a)) + " & " + disp(byId(u.b)); }

function renumber() { [...state.members].sort((a, b) => a.order - b.order).forEach((m, i) => { m.order = i + 1; }); orderSeq = state.members.length + 1; }
function addParents(m) {
  if (m.unionId && state.unions.find((u) => u.id === m.unionId)) return;
  const f = mk({ name: "Ayah " + shortName(m), sex: "M", order: m.order - 0.6 });
  const mo = mk({ name: "Ibu " + shortName(m), sex: "F", order: m.order - 0.5 });
  state.members.push(f, mo);
  const u = { id: uid("u"), a: f.id, b: mo.id, status: "married", year: "" };
  state.unions.push(u); m.unionId = u.id; renumber(); return f;
}
function addSibling(m) {
  if (!m.unionId) addParents(m);
  const s = mk({ name: "Saudara " + shortName(m), sex: "F", unionId: m.unionId, order: m.order + 0.5 });

  }
  if (t.dataset.c) { state[t.dataset.c] = t.type === "checkbox" ? t.checked : t.value; return t.type === "checkbox" ? "full" : "canvas"; }
  if (t.dataset.u) { const u = state.unions.find((z) => z.id === t.dataset.u); if (u) u[t.dataset.uf] = t.value; return "canvas"; }
  if (t.dataset.r) { const r = state.relations.find((z) => z.id === t.dataset.r); if (r) r[t.dataset.rf] = t.value; return "canvas"; }
  if (t.dataset.e) { const e = state.eco.find((z) => z.id === t.dataset.e); if (e) e[t.dataset.ef] = t.value; return "canvas"; }

}

const browserSaver = { save: async ({ filename, data }) => {
  const blob = data instanceof Blob ? data : new Blob([data], { type: filename.endsWith(".svg") ? "image/svg+xml" : filename.endsWith(".json") ? "application/json" : "application/octet-stream" });
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return { status: "saved" };
} };

function slug() { return (state.title || "kasus").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "kasus"; }
async function save(filename, data) {

  catch (e) {

    if (c === "declined") return;
    if (c === "rate_limited") toast("Masih ada jendela unduhan yang terbuka. Coba lagi sebentar.");
    else toast("Unduhan gagal" + (c ? " (" + c + ")" : "") + ".");

}
function toPng(r, scale) {
  return new Promise((resolve, reject) => {
    const svg = svgDoc(r);
    const img = new Image();
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = Math.round(r.w * scale); c.height = Math.round(r.h * scale);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c);
    };
    img.onerror = (e) => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}

$("#ex-png").addEventListener("click", async () => {

$("#ex-pdf").addEventListener("click", async () => {

    const pages = [["Lembar presentasi", renderSheet()], ["Genogram", renderGeno()], ["Peta keluarga", renderMap()], ["Ekomap", renderEco()]];
    let doc = null;
    for (const [, r] of pages) {
      const land = r.w >= r.h;
      const pw = land ? 297 : 210, ph = land ? 210 : 297, mgn = 8;
      if (!doc) doc = new jsPDF({ orientation: land ? "landscape" : "portrait", unit: "mm", format: "a4" });
      else doc.addPage("a4", land ? "landscape" : "portrait");
      const c = await toPng(r, 2);
      const k = Math.min((pw - 2 * mgn) / r.w, (ph - 2 * mgn) / r.h);
      const iw = r.w * k, ih = r.h * k;
      doc.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", (pw - iw) / 2, (ph - ih) / 2, iw, ih);
    }

  } catch (e) { toast("PDF gagal dibuat."); }
});

let toastT = null;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

let resizeT = null;
window.addEventListener("resize", () => { if (ui.zoom !== "fit") return; clearTimeout(resizeT); resizeT = setTimeout(drawCanvas, 120); });
renderEditor();
drawCanvas();
})();
</script>

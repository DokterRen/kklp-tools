<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kepatuhan Minum Obat</title>
<meta name="description" content="Kuesioner kepatuhan minum obat Morisky 4 butir dengan skor otomatis dan ringkasan A4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/instrumen.css"><style>
.sheet .result { display: flex; align-items: center; gap: 22px; background: #F4FAF9; border-radius: 10px; padding: 14px 20px; font-size: 14px; }
.sheet .result .big { font-family: 'Source Serif 4', Georgia, serif; font-size: 52px; font-weight: 700; line-height: 1; color: #013A40; }
.sheet .result .big small { font-size: 22px; color: #4A6563; }
.sheet .result .pill { font-size: 15px; padding: 3px 12px; border-radius: 14px; }
.sheet .result .eq { margin-top: 4px; font-size: 12.5px; color: #4A6563; }
.sheet .bands { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.sheet .bands div { border-radius: 6px; padding: 5px 6px; text-align: center; font-size: 11.5px; color: #4A6563; border: 1.5px solid #D5E4E1; line-height: 1.2; }
.sheet .bands div b { display: block; font-size: 13px; color: #16302E; }
.sheet .bands div.on { background: var(--c); border-color: var(--c); color: #FFFFFF; }
.sheet .bands div.on b { color: #FFFFFF; }
.sheet .idb { grid-template-columns: 84px minmax(0, 1fr); width: 290px; }
.sheet .meta { display: flex; flex-wrap: wrap; gap: 2px 18px; font-size: 13px; margin-top: -4px; }
.sheet .meta b { color: #4A6563; font-weight: 600; }
.sheet .hbar { height: 9px; border-radius: 5px; background: #E6EEED; overflow: hidden; }
.sheet .hbar i { display: block; height: 100%; }
.sheet table.t { font-size: 13px; }
.sheet table.t td { padding: 5px 8px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <a class="home" href="./" aria-label="Kembali ke beranda"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></a>
    <div><h1>Kepatuhan Minum Obat</h1><p>Morisky, Green &amp; Levine 4 butir</p></div>
  </div>
  <div class="actions">
    <button class="btn" id="btn-new" type="button">Penilaian baru</button>
    <button class="btn" id="btn-sample" type="button">Contoh</button>
    <button class="btn primary" id="btn-archive" type="button">Simpan ke daftar pasien</button>
  </div>
</header>

<div class="layout">
  <div class="viewtoggle seg" role="group" aria-label="Tampilan">
    <button type="button" data-view="form">Isi data</button><button type="button" data-view="preview">Ringkasan &amp; cetak</button>
  </div>
  <form class="form-col" id="form" autocomplete="off" onsubmit="return false">
    <div class="idhint" id="idhint" hidden></div>
    <details class="card"><summary>Daftar pasien tersimpan <span class="count" id="arsip-count">0</span></summary><div class="card-body">
      <input type="search" id="arsip-cari" placeholder="Cari nama atau No. RM" aria-label="Cari pasien">
      <div class="archive" id="archive"></div>
      <div class="checks"><button class="btn sm" type="button" id="btn-json">Simpan file data (.json)</button><button class="btn sm" type="button" id="btn-open">Buka file data</button></div>
      <p class="note">Daftar ini hanya tersimpan di browser perangkat ini.</p>
    </div></details>
    <div id="sections"></div>
    <input type="file" id="file-in" accept=".json,application/json" class="sr" tabindex="-1" aria-hidden="true">
  </form>

  <section class="preview-col" aria-label="Ringkasan">
    <div class="ptools">
      <button class="btn primary" id="btn-print" type="button">Cetak / Simpan PDF</button>
      <button class="btn" id="btn-pdf" type="button">Unduh PDF</button>
    </div>
    <div class="pages" id="pages"><div class="pagebox"><div class="sheet" id="sheet1"></div></div></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/app.js"></script>
<script src="assets/instrumen.js"></script>
<script>
(function () {
  "use strict";
  const { $, $$, esc, today } = KKLP;
  const { radios, card, pill, fmt1, has, num, none, identity, head, foot, notes } = KKLP_I;
  const DOKTER = "dr. Caren Andika Surbakti, Sp.KKLP";

  const ITEMS = [
    ["Apakah Anda pernah lupa minum obat?", "tidak sengaja"],
    ["Apakah Anda kadang-kadang kurang memperhatikan waktu minum obat?", "tidak sengaja"],
    ["Ketika merasa lebih baik, apakah Anda kadang-kadang berhenti minum obat?", "sengaja"],
    ["Bila merasa lebih buruk setelah minum obat, apakah Anda kadang-kadang berhenti meminumnya?", "sengaja"],
  ];
  const cat = (t) => (t === 0 ? ["Kepatuhan tinggi", "#3E9B3A"] : t <= 2 ? ["Kepatuhan sedang", "#C98A00"] : ["Kepatuhan rendah", "#B3363F"]);
  $("#sections").innerHTML =
    card("id", 0, "Identitas", identity() + `<div class="field"><label for="f-resp">Responden</label><input type="text" id="f-resp" data-k="resp" placeholder="pasien, atau pendamping yang menyiapkan obat"></div>
      <div class="field"><label for="f-obat">Obat yang sedang diminum (opsional)</label><textarea id="f-obat" data-k="obat" rows="2" placeholder="mis. metformin 2x500 mg, amlodipin 1x10 mg"></textarea></div>`, true) +
    card("items", 0, "Kepatuhan minum obat (Morisky 4 butir)", ITEMS.map(([t], i) => `<div class="q"><div class="qt"><b>${i + 1}.</b> ${t}</div>${radios("mg" + i, [["1", "Ya"], ["0", "Tidak"]], "three")}</div>`).join("") +
      `<div class="score" id="sc"></div>`, true) +
    card("cat", 0, "Catatan dan rencana", `<div class="field"><label for="f-cat">Hambatan yang ditemukan dan rencana</label><textarea id="f-cat" data-k="catatan" rows="4"></textarea></div>
      <div class="field"><label for="f-foot">Kaki halaman</label><input type="text" id="f-foot" data-k="footer"></div>`);
  function render(st) {
    const vals = ITEMS.map((_, i) => (has(st, "mg" + i) ? num(st, "mg" + i) : null)), answered = vals.filter((v) => v !== null).length;
    const total = answered === 4 ? vals.reduce((a, b) => a + b, 0) : null;
    const unint = total === null ? 0 : vals[0] + vals[1], inten = total === null ? 0 : vals[2] + vals[3];
    const kind = !total ? "" : unint && inten ? "sengaja dan tidak sengaja" : unint ? "tidak sengaja (lupa atau lalai)" : "sengaja (menghentikan obat sendiri)";
    $("#sc").innerHTML = total === null ? `<span class="note">${answered}/4 terjawab</span>` : `<span>Skor <b>${total}</b>/4 · ${cat(total)[0]}</span>` + (kind ? `<span>Ketidakpatuhan ${kind}</span>` : "");
    $("#cnt-items").textContent = total === null ? answered + "/4" : total + "/4";
    const table = `<table class="t"><colgroup><col style="width:28px"><col><col style="width:120px"><col style="width:66px"></colgroup>
      <thead><tr><th class="c">No</th><th>Pertanyaan</th><th>Jenis</th><th class="c">Jawaban</th></tr></thead><tbody>` +
      ITEMS.map(([t, k], i) => `<tr><td class="c">${i + 1}</td><td>${esc(t)}</td><td>Ketidakpatuhan ${k}</td><td class="c">${vals[i] === null ? "–" : vals[i] ? "<b>Ya</b> (1)" : "Tidak (0)"}</td></tr>`).join("") +
      `<tr class="tot"><td></td><td colspan="2">Skor (0 tinggi · 1–2 sedang · 3–4 rendah)</td><td class="c">${total === null ? "–" : total}</td></tr></tbody></table>`;
    const advice = total === null ? "" : `<div class="box">${!total ? "<b>Tidak ada tanda ketidakpatuhan.</b> Pertahankan dan tanyakan kembali pada kunjungan berikutnya." :
      `<b>Arah intervensi:</b><ul>${unint ? "<li>Tidak sengaja: kotak obat mingguan, alarm atau pengingat, kaitkan dengan kegiatan rutin, libatkan keluarga, sederhanakan jadwal minum obat.</li>" : ""}${inten ? "<li>Sengaja: gali alasan dan kekhawatiran (efek samping, merasa sudah sehat, biaya), jelaskan tujuan obat jangka panjang, pertimbangkan penyesuaian regimen.</li>" : ""}</ul>`}</div>`;
    $("#sheet1").innerHTML = `<div class="pg">${head(st, "Kepatuhan Minum Obat", "Morisky, Green &amp; Levine, 4 butir", [["Responden", st.resp]])}
      <div class="result">${total === null ? `<div class="big muted">–</div><div>${answered}/4 butir terjawab</div>` : `<div class="big">${total}<small> / 4</small></div><div>${pill(cat(total))}${kind ? `<div class="eq">Ketidakpatuhan ${kind}</div>` : ""}</div>`}</div>
      <section>${table}</section>
      ${advice}
      ${st.obat ? `<section><h2>Obat yang sedang diminum</h2><div class="box" style="white-space:pre-wrap">${esc(st.obat)}</div></section>` : ""}
      ${notes(st, "catatan", "Catatan dan Rencana")}
      ${foot(st, "Morisky DE, Green LW, Levine DM. Medical Care 1986;24:67–74. Skor: setiap jawaban “Ya” = 1. Terjemahan tidak resmi.")}</div>`;
  }
  function defaults() { return { tanggal: today(), footer: "Kepatuhan Minum Obat - " + DOKTER }; }
  function sample() {
    return { nama: "Bapak S (contoh)", rm: "12-34-56", usia: "64", resp: "Bapak S, dibantu Dewi", obat: "Metformin 2x500 mg, amlodipin 1x10 mg, candesartan 1x16 mg, asetosal 1x80 mg, atorvastatin 1x20 mg",
      mg0: "1", mg1: "0", mg2: "1", mg3: "0", catatan: "Sering lupa dosis siang. Berhenti obat darah tinggi bila tekanan darah normal. Rencana: kotak obat mingguan, alarm ponsel, edukasi bahwa obat diminum jangka panjang walaupun tensi sudah normal." };
  }
  KKLP.docTool({ key: "kepatuhan-obat", defaults, sample, render });

})();
</script>
</body>
</html>
